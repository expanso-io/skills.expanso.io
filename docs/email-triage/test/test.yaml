# Test: email-triage
# ==================
#
# Validates email triage pipeline behavior.

tests:
  - name: "Processes emails and categorizes correctly"
    input: '{"provider":"gmail"}'
    provider_responses:
      - messages: [{id: "1"}]
      - id: "1"
        snippet: Please investigate
        payload:
          headers:
            - {name: Subject, value: Urgent incident}
            - {name: From, value: ops@example.test}
          parts: []
    expected_output:
      summary:
        processed: 1

  - name: "Extracts meeting requests"
    input: '{"provider":"gmail","extract_calendar_events":true}'
    provider_responses:
      - messages: [{id: "1"}]
      - id: "1"
        snippet: Friday at 3pm
        payload:
          headers:
            - {name: Subject, value: Meeting}
            - {name: From, value: pm@example.test}
          parts: []
    output_conditions:
      - path: "calendar_events"
        condition: "length >= 0"
      - path: metadata.processing_time_ms
        condition: ">= 0"
      - path: metadata.processing_time_ms
        condition: "< 10000"

  - name: "Handles empty inbox"
    input: '{"provider":"gmail"}'
    provider_responses:
      - messages: []
    expected_output:
      summary:
        processed: 0
