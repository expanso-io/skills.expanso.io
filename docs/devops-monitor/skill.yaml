# Skill: devops-monitor
# Version: 1.0.0
#
# Analyze observations collected by DevOps monitoring systems.
#
# Features:
# - Log analysis and anomaly detection
# - Workflow-run status analysis
# - Error-event severity classification
# - Thresholded alert candidates

name: devops-monitor
version: 1.0.0
description: Analyze supplied workflow, log, and metric observations without inventing collector or alert receipts

inputs:
  - name: workflows
    type: array
    default: []
    description: Workflow-run observations from an upstream collector
  - name: errors
    type: array
    default: []
    description: Aggregated error events from an upstream log collector
  - name: metrics
    type: object
    default: {}
    description: Metric snapshot to include in the report
  - name: alert_threshold
    type: string
    default: high
    enum: [low, medium, high, critical]
    description: Minimum severity for alerts

outputs:
  - name: status
    type: object
    description: "Overall status: {healthy, warnings, errors}"
  - name: issues
    type: array
    description: "Detected issues: {severity, source, description, suggestion}"
  - name: workflows
    type: array
    description: GitHub workflow statuses
  - name: metrics
    type: object
    description: Key metrics summary
  - name: alert_candidates
    type: array
    description: Issues meeting the configured threshold; no delivery is claimed
  - name: metadata
    type: object
    description: Monitoring metadata

backends:
  - name: local
    type: local
    requires: []
    description: Deterministic local analysis of supplied observations

components:
  inputs: [stdin, http_server]
  processors: [mapping, log]
  outputs: [stdout, sync_response]
