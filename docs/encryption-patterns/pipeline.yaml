name: encryption-patterns-complete
type: pipeline
description: Authenticated encryption envelopes for payment, contact, address, and temporal fields.
namespace: production
labels:
  category: data-security
  pattern: encryption

config:
  input:
    http_server:
      address: "0.0.0.0:8080"
      path: "/encrypt"
      allowed_verbs: ["POST"]
      timeout: "30s"

  pipeline:
    processors:
      - mapping: |
          let required_fields = ["payment.card_number", "customer.email"]
          let missing_fields = $required_fields.filter(field -> this.get(field) == null)
          let encryption_key = env("FIELD_ENCRYPTION_KEY_HEX").or("")
          let mac_key = env("FIELD_MAC_KEY").or("")

          root = if $missing_fields.length() > 0 {
            throw("Missing required fields: " + $missing_fields.join(", "))
          } else if !$encryption_key.re_match("^[0-9a-fA-F]{64}$") {
            throw("FIELD_ENCRYPTION_KEY_HEX must contain exactly 32 bytes as hexadecimal")
          } else if $mac_key.length() < 32 {
            throw("FIELD_MAC_KEY must contain at least 32 characters")
          } else {
            this
          }

          root.processing_metadata = {
            "pipeline_version": env("PIPELINE_VERSION").or("2.1.0"),
            "node_id": env("NODE_ID").or("unknown"),
            "processing_start": now()
          }

      # Fail closed: never retain the original plaintext after validation or
      # encryption fails.
      - catch:
          - mapping: 'root = deleted()'

      # Each object receives a fresh 128-bit IV. The HMAC covers the field
      # context, IV, and ciphertext and must be verified before decryption.
      - mapping: |
          root = this

          let plaintext = this.payment.format_json()
          let key = env("FIELD_ENCRYPTION_KEY_HEX").decode("hex")
          let mac_key = env("FIELD_MAC_KEY")
          let iv = uuid_v4().replace_all("-", "").decode("hex")
          let iv_hex = $iv.encode("hex")
          let ciphertext = $plaintext.encrypt_aes("ctr", $key, $iv).encode("base64")
          let mac = ("payment:" + $iv_hex + ":" + $ciphertext).hash("hmac_sha256", $mac_key).encode("hex")
          let card_num = this.payment.card_number.or("").re_replace_all("[^0-9]", "")

          root.payment = {
            "card_brand": match {
              $card_num.re_match("^4[0-9]{12,18}$") => "visa",
              $card_num.re_match("^5[1-5][0-9]{14}$") => "mastercard",
              $card_num.re_match("^3[47][0-9]{13}$") => "american_express",
              $card_num.re_match("^6011[0-9]{12}$") => "discover",
              _ => "unknown"
            },
            "card_last_four": $card_num.slice(-4),
            "card_bin": $card_num.slice(0, 6),
            "protected": {
              "ciphertext": $ciphertext,
              "iv": $iv_hex,
              "mac": $mac
            }
          }

      - mapping: |
          root = this

          let plaintext = this.customer.format_json()
          let key = env("FIELD_ENCRYPTION_KEY_HEX").decode("hex")
          let mac_key = env("FIELD_MAC_KEY")
          let iv = uuid_v4().replace_all("-", "").decode("hex")
          let iv_hex = $iv.encode("hex")
          let ciphertext = $plaintext.encrypt_aes("ctr", $key, $iv).encode("base64")
          let mac = ("customer:" + $iv_hex + ":" + $ciphertext).hash("hmac_sha256", $mac_key).encode("hex")
          let email = this.customer.email.or("").lowercase()
          let ssn = this.customer.ssn.or("").re_replace_all("[^0-9]", "")
          let birth_date = this.customer.date_of_birth.or("")
          let birth_year = if $birth_date.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") {
            $birth_date.ts_parse("2006-01-02").ts_format("2006").number()
          } else {
            null
          }
          let age = now().ts_format("2006").number() - $birth_year.or(now().ts_format("2006").number())

          root.customer = {
            "email_domain": $email.split("@").index(1),
            "ssn_last_four": $ssn.slice(-4),
            "birth_year": $birth_year,
            "age_range": if $birth_year != null {
              match {
                $age < 18 => "under_18",
                $age < 35 => "18_to_34",
                $age < 55 => "35_to_54",
                $age < 65 => "55_to_64",
                _ => "65_plus"
              }
            },
            "protected": {
              "ciphertext": $ciphertext,
              "iv": $iv_hex,
              "mac": $mac
            }
          }

      - mapping: |
          root = this

          let plaintext = this.billing_address.format_json()
          let key = env("FIELD_ENCRYPTION_KEY_HEX").decode("hex")
          let mac_key = env("FIELD_MAC_KEY")
          let iv = uuid_v4().replace_all("-", "").decode("hex")
          let iv_hex = $iv.encode("hex")
          let ciphertext = $plaintext.encrypt_aes("ctr", $key, $iv).encode("base64")
          let mac = ("billing_address:" + $iv_hex + ":" + $ciphertext).hash("hmac_sha256", $mac_key).encode("hex")
          let zip_clean = this.billing_address.zip.or("").re_replace_all("[^0-9]", "")

          root.billing_address = {
            "zip_prefix": $zip_clean.slice(0, 3),
            "city": this.billing_address.city,
            "state": this.billing_address.state,
            "country": this.billing_address.country,
            "protected": {
              "ciphertext": $ciphertext,
              "iv": $iv_hex,
              "mac": $mac
            }
          }

      - mapping: |
          root = this
          root.processing_metadata.processing_complete = now()
          root.processing_metadata.encryption_status = "success"
          root.processing_metadata.algorithm = "AES-256-CTR+HMAC-SHA256"
          root.processing_metadata.key_version = env("KEY_VERSION").or("v1")

      # Catch failures from every encryption stage, including failures after
      # earlier fields have already been transformed.
      - catch:
          - mapping: 'root = deleted()'

  output:
    broker:
      pattern: fan_out
      outputs:
        # Primary encrypted data
        - file:
            path: "./encrypted-data-${!timestamp_unix()}.jsonl"
            codec: "lines"

        # Audit trail
        - file:
            path: "./audit-trail-${!timestamp_unix()}.jsonl"
            codec: "lines"
          processors:
            - mapping: |
                root = {
                  "audit_id": "enc_" + uuid_v4(),
                  "timestamp": now(),
                  "event_type": "field_level_encryption_complete",
                  "node_id": env("NODE_ID").or("unknown"),
                  "encryption_summary": {
                    "objects_encrypted": 3,
                    "algorithm": "AES-256-CTR+HMAC-SHA256"
                  }
                }

logger:
  level: "INFO"
  format: json

metrics:
  prometheus:
    path: "/metrics"
