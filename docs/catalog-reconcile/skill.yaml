# Skill: catalog-reconcile
# Version: 1.0.0
#
# Reconcile product data across multiple catalogs.
# Inspired by @BwcDeals reducing days of work to minutes.

name: catalog-reconcile
version: 1.0.0
description: Deterministic product catalog reconciliation across named source manifests

inputs:
  - name: catalogs
    type: array
    required: true
    description: "Named catalogs: [{name, items: [{sku, upc, name, ...}]}]"
  - name: match_fields
    type: array
    default: [sku, upc, name]

outputs:
  - name: matches
    type: array
  - name: conflicts
    type: array
  - name: unmatched
    type: array
  - name: metadata
    type: object

backends:
  - name: local
    type: local

components:
  inputs: [stdin, http_server]
  processors: [mapping, log]
  outputs: [stdout, sync_response]
