# Expanso Pipeline: sign-envelope (CLI mode)
# ============================================
#
# Create signed envelope for payload.
#
# Usage:
#   expanso-edge validate pipeline-cli.yaml
#
# Validates against: docs.expanso.io/schemas/pipeline.schema.json

name: sign-envelope-cli
type: pipeline

config:
  input:
    stdin:
      codec: lines

  pipeline:
    processors:
      - mapping: |
          let trace_id = uuid_v4()
          let created_at = now()
          meta trace_id = $trace_id
          meta created_at = $created_at

          let payload = content().string()
          let canonical = $payload.parse_json().catch($payload).format_json().catch($payload)
          let hash = $canonical.hash("sha256").encode("hex")

          # HMAC-SHA256 signature using a required, strong key from node-local secrets.
          let key = env("SIGNING_KEY").or("")
          let signature = if $key.length() < 32 {
            throw("SIGNING_KEY must contain at least 32 characters")
          } else {
            $hash.hash("hmac_sha256", $key).encode("hex")
          }

          root.envelope = {
            "payload": $payload.parse_json().catch($payload),
            "hash": $hash,
            "signature": $signature,
            "key_id": env("KEY_ID").or("default"),
            "algorithm": "hmac-sha256",
            "created_at": $created_at
          }
          root.metadata = {
            "skill": "sign-envelope",
            "mode": "cli",
            "trace_id": $trace_id,
            "timestamp": now()
          }

      - log:
          level: INFO
          message: |
            [sign-envelope] Signed payload (hash: ${! this.envelope.hash.slice(0, 16) }..., trace: ${! meta("trace_id").slice(0, 8) })

  output:
    stdout: {}
