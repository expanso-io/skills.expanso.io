name: aggregate-time-windows-complete
type: pipeline
description: Event-time sensor and location aggregates over five-minute sliding windows emitted every minute.
namespace: production
labels:
  category: data-transformation
  pattern: time-window-aggregation
  environment: production

config:
  input:
    kafka:
      addresses: ["${KAFKA_BROKERS}"]
      topics: ["${INPUT_TOPIC:sensor-events}"]
      consumer_group: "time-window-aggregation-${INSTANCE_ID:default}"
      tls:
        enabled: true
      sasl:
        mechanism: SCRAM-SHA-512
        user: "${KAFKA_USERNAME}"
        password: "${KAFKA_PASSWORD}"

  # Edge v2.1.21 buffers by event time and adds window_end_timestamp to each
  # message. A five-minute window sliding once per minute produces real
  # overlapping windows rather than merely assigning a synthetic window key.
  buffer:
    system_window:
      timestamp_mapping: 'root = this.timestamp'
      size: 5m
      slide: 1m
      allowed_lateness: 30s

  pipeline:
    processors:
      - mapping: |
          root = if this.sensor_id == null || this.temperature == null || this.timestamp == null {
            throw("sensor_id, temperature, and timestamp are required")
          } else if this.temperature.type() != "number" {
            throw("temperature must be numeric")
          } else {
            [
              this.merge({
                "aggregation_level": "sensor",
                "group_key": this.sensor_id.string()
              }),
              this.merge({
                "aggregation_level": "location",
                "group_key": this.location.or("unknown_location").string()
              })
            ]
          }

      - unarchive:
          format: json_array

      - group_by_value:
          value: '${! json("aggregation_level") }|${! json("group_key") }'

      - mapping: |
          let temperatures = json("temperature").from_all()
          let first = this
          let event_count = $temperatures.length()
          let temperature_change = $temperatures.index($event_count - 1) - $temperatures.index(0)
          root = if batch_index() == 0 {
            {
              "aggregation_type": "sliding",
              "aggregation_level": $first.aggregation_level,
              "group_key": $first.group_key,
              "sensor_id": if $first.aggregation_level == "sensor" { $first.sensor_id },
              "location": $first.location.or("unknown_location"),
              "sensor_count": json("sensor_id").from_all().unique().length(),
              "event_count": $event_count,
              "temperature_avg": $temperatures.sum() / $event_count,
              "temperature_min": $temperatures.min(),
              "temperature_max": $temperatures.max(),
              "temperature_change": $temperature_change,
              "temperature_trend": if $temperature_change > 1 { "increasing" } else if $temperature_change < -1 { "decreasing" } else { "stable" },
              "window_start": meta("window_end_timestamp").ts_parse("2006-01-02T15:04:05.999999999Z07:00").ts_sub_iso8601("PT5M"),
              "window_duration_minutes": 5,
              "window": {
                "type": "sliding",
                "duration_seconds": 300,
                "slide_seconds": 60,
                "end": meta("window_end_timestamp")
              },
              "data_quality_score": if $event_count >= 50 { 0.95 } else if $event_count >= 30 { 0.85 } else if $event_count >= 10 { 0.70 } else { 0.50 },
              "aggregation_timestamp": now()
            }
          } else {
            deleted()
          }

  output:
    kafka:
      addresses: ["${KAFKA_BROKERS}"]
      topic: "${OUTPUT_TOPIC:sensor-aggregates}"
      key: '${! json("aggregation_level") }|${! json("group_key") }'
      ack_replicas: true
      tls:
        enabled: true
      sasl:
        mechanism: SCRAM-SHA-512
        user: "${KAFKA_USERNAME}"
        password: "${KAFKA_PASSWORD}"

logger:
  level: "${LOG_LEVEL:INFO}"
  format: json

metrics:
  prometheus:
    path: /metrics
