# Skill: task-dashboard
name: task-dashboard
version: 1.0.0
description: Summarize task records supplied by an upstream queue or task system

inputs:
  - name: action
    type: string
    default: status
    enum: [status, add, complete, prioritize]
  - name: task
    type: object
    required: false
    description: Retained for compatibility; state-changing actions report unsupported
  - name: tasks
    type: array
    required: true
    description: Current task records to summarize

outputs:
  - name: queue
    type: array
  - name: completed
    type: array
  - name: status
    type: object
  - name: metadata
    type: object

backends:
  - name: local
    type: local
    requires: []
    description: Deterministic local task summary

components:
  inputs: [stdin, http_server]
  processors: [mapping, log]
  outputs: [stdout, sync_response]
