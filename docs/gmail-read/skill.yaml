# Skill: gmail-read
# Version: 1.0.0
#
# Read message metadata and snippets from the Gmail API.
# Gmail OAuth tokens are read from the executing node's environment and sent to
# the Gmail API (Google) as the bearer credential. They are not sent to Expanso
# Cloud and are not exposed to the calling agent. Mail data is fetched from
# Google.
#
# Compose with security skills for safe agent access:
#   access-gate → gmail-read → pii-redact → data-fence → audit-log

name: "gmail-read"
version: "1.0.0"
description: "Read emails from Gmail with filtering, search, and label support"

author:
  name: "Expanso Team"
  url: "https://expanso.io"
  avatar: "EX"

# Credentials (read from the executing node's environment; sent to Google only)
credentials:
  - name: GMAIL_ACCESS_TOKEN
    required: true
    description: Gmail OAuth2 access token
  - name: MCP_BEARER_TOKEN
    required: false
    description: Required caller bearer token for the MCP endpoint (32+ characters)

# Skill inputs
inputs:
  - name: query
    type: string
    required: false
    default: "is:unread"
    description: Gmail search query (same syntax as Gmail search bar)
  - name: label
    type: string
    required: false
    default: "INBOX"
    description: Gmail label to read from
  - name: limit
    type: integer
    default: 20
    description: Maximum emails to retrieve (1-100)

# Skill outputs
outputs:
  - name: source
    type: string
    description: 'Source identifier: gmail'
  - name: resource
    type: string
    description: 'Resource identifier: messages'
  - name: schema_version
    type: string
    description: 'Response envelope schema version: 1.0'
  - name: trace_id
    type: string
    description: Request trace identifier
  - name: data
    type: array
    description: "Array of messages: {id, subject, from, to, date, snippet, labels, has_attachment}"
  - name: emails
    type: array
    description: Compatibility alias for data
  - name: count
    type: integer
    description: Number of messages in data
  - name: sensitivity
    type: string
    description: 'Data sensitivity: raw'
  - name: metadata
    type: object
    description: "Processing metadata: {skill, mode, query, label, source, email_count, total_estimated, trace_id, timestamp}"

# Backend options
backends:
  - name: gmail-api
    type: remote
    requires: [GMAIL_ACCESS_TOKEN]
    description: Gmail API via OAuth2 (requires gmail.readonly scope)

# Expanso components used
components:
  inputs:
    - stdin
    - http_server
  processors:
    - mapping
    - http
    - log
  outputs:
    - stdout
    - sync_response
