# Expanso Pipeline: timestamp-parse (CLI mode)
# =============================================
#
# Usage:
#   expanso-edge validate pipeline-cli.yaml
#   expanso-edge validate pipeline-cli.yaml
#   expanso-edge validate pipeline-cli.yaml
#
# No API key needed - runs entirely locally.

name: "timestamp-parse-cli"
type: pipeline

config:
  input:
    stdin:
      codec: all
      max_buffer: 1024

  pipeline:
    processors:
      - mapping: |
          meta trace_id = uuid_v4()
          let input = content().trim()

          # Get current time or parse input
          let parsed = $input.ts_parse("2006-01-02T15:04:05.999999999Z07:00").catch(
              $input.ts_parse("2006-01-02T15:04:05.999999999Z0700").catch(
                $input.ts_parse("2006-01-02").catch(null)
              )
          )
          let ts = if $input.length() == 0 {
            now()
          } else if $parsed == null {
            throw("timestamp must be ISO 8601 or YYYY-MM-DD")
          } else {
            $parsed
          }

          root.iso = $ts.ts_format("2006-01-02T15:04:05.999999999Z07:00")
          root.date = $ts.ts_format("2006-01-02")
          root.time = $ts.ts_format("15:04:05")
          root.unix = $ts.ts_unix()
          root.unix_ms = $ts.ts_unix_milli()
          root.day_of_week = $ts.ts_format("Monday")
          root.metadata = {
            "skill": "timestamp-parse",
            "mode": "cli",
            "input": $input,
            "trace_id": meta("trace_id").or(uuid_v4()),
            "timestamp": now()
          }

      - catch:
          - mapping: |
              root = {"status": "error", "error": error()}

      - log:
          level: INFO
          message: |
            [timestamp-parse] Processed timestamp (trace: ${! meta("trace_id").slice(0, 8) })

  output:
    stdout: {}
