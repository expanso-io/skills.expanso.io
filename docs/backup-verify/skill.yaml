# Skill: backup-verify
# Version: 1.0.0
#
# Verify backup integrity by comparing independently generated manifests.

name: backup-verify
version: 1.0.0
description: Compare local and backup manifests by path, size, and SHA-256 digest

inputs:
  - name: local_manifest
    type: array
    required: true
    description: "Local manifest entries: [{path, size, sha256}]"
  - name: backup_manifest
    type: array
    required: true
    description: "Backup manifest entries: [{path, size, sha256}]"
  - name: cloud_provider
    type: string
    default: s3
    enum: [s3, gcs, azure, backblaze]
  - name: bucket
    type: string
    required: false
    description: Provider that produced backup_manifest; this pipeline does not fetch it

outputs:
  - name: status
    type: object
  - name: differences
    type: array
  - name: metadata
    type: object

backends:
  - name: local
    type: local

components:
  inputs: [stdin, http_server]
  processors: [mapping, log]
  outputs: [stdout, sync_response]
