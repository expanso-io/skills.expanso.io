# Expanso Pipeline: morning-briefing (CLI mode)
#
# Combine calendar, weather, news, and task records supplied by upstream
# collectors. The pipeline does not claim to fetch or update those services.

name: morning-briefing-cli
type: pipeline

config:
  input:
    stdin:
      codec: lines

  pipeline:
    processors:
      - mapping: |
          meta trace_id = uuid_v4()
          let input = content().parse_json()
          let data = {
            "calendar": $input.calendar.or([]),
            "weather": $input.weather.or({}),
            "news": $input.news.or([]),
            "tasks": $input.tasks.or([])
          }
          let priorities = $data.tasks.filter(task -> task.priority.or(99) <= 2).map_each(task -> task.title.or("Untitled task"))

          meta location = $input.location.or($data.weather.location).or("")
          meta briefing_json = $data.format_json()
          meta priorities_json = $priorities.format_json()

          root.messages = [
            {
              "role": "system",
              "content": "Create a concise morning briefing using only the supplied records. Do not invent meetings, weather, headlines, tasks, or delivery receipts."
            },
            {
              "role": "user",
              "content": "Briefing records:\n" + $data.format_json()
            }
          ]

      - openai_chat_completion:
          api_key: "${OPENAI_API_KEY}"
          model: gpt-4o-mini
          tools: []

      - mapping: |
          root.briefing = meta("briefing_json").parse_json()
          root.summary = this.choices.0.message.content
          root.priorities = meta("priorities_json").parse_json()
          root.metadata = {
            "skill": "morning-briefing",
            "mode": "cli",
            "source": "request",
            "location": meta("location"),
            "trace_id": meta("trace_id").or(uuid_v4()),
            "timestamp": now()
          }

      - log:
          level: INFO
          message: "[morning-briefing] summarized ${! this.briefing.calendar.length() } events and ${! this.briefing.tasks.length() } tasks"

  output:
    stdout: {}
