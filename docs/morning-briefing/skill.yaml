# Skill: morning-briefing
# Version: 1.0.0
#
# Personalized daily briefing from records supplied by upstream collectors.
#
# Features:
# - Calendar events and deadlines supplied in the request
# - Supplied weather, news, and task summaries
# - AI-generated priorities and focus areas

name: morning-briefing
version: 1.0.0
description: Summarize supplied calendar, weather, news, and task records into a morning briefing

credentials:
  - name: OPENAI_API_KEY
    required: true
    description: OpenAI for the briefing summary

inputs:
  - name: location
    type: string
    default: "San Francisco, CA"
    description: Location for weather
  - name: calendar
    type: array
    default: []
    description: Calendar event records from an upstream collector
  - name: weather
    type: object
    default: {}
    description: Current weather record from an upstream collector
  - name: news
    type: array
    default: []
    description: Headline records from an upstream collector
  - name: tasks
    type: array
    default: []
    description: Task records from an upstream collector

outputs:
  - name: briefing
    type: object
    description: "Complete briefing: {calendar, weather, news, tasks, priorities}"
  - name: summary
    type: string
    description: AI-generated executive summary
  - name: metadata
    type: object
    description: Generation metadata

backends:
  - name: openai
    type: remote
    requires: [OPENAI_API_KEY]

components:
  inputs: [stdin, http_server]
  processors: [mapping, openai_chat_completion, log]
  outputs: [stdout, sync_response]
