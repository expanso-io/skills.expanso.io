name: deduplicate-events-complete
type: pipeline
description: Complete Event Deduplication Pipeline - Detects and filters duplicate events using cache-based deduplication.
namespace: production
labels:
  category: data-transformation
  pattern: deduplication

config:
  cache_resources:
    - label: dedup_cache
      memory:
        default_ttl: 1h

  input:
    http_server:
      address: "0.0.0.0:8080"
      path: /events
      allowed_verbs: ["POST"]

  pipeline:
    processors:
      # Step 1: Parse and validate
      - mapping: |
          root = this
          root.received_at = now()

          # Validate required fields
          root = if this.event_id == null {
            throw("Missing required field: event_id")
          } else {
            this
          }

      # Step 2: Generate deduplication key
      - mapping: |
          root = this

          # Create composite key for deduplication
          # Options: event_id only, or event_id + type + timestamp window
          root.dedup_key = if this.dedup_strategy.or("event_id") == "composite" {
            # Composite: event_type + source + 1-minute window
            this.event_type.or("unknown") + ":" + this.source.or("unknown") + ":" + (this.timestamp.or(now()).ts_unix() / 60).floor().string()
          } else {
            # Simple: just event_id
            this.event_id
          }

          meta dedup_key = root.dedup_key

      - switch:
          - check: '!errored()'
            processors:
              - try:
                  - cache:
                      resource: dedup_cache
                      operator: add
                      key: '${!meta("dedup_key")}'
                      value: 'seen'
                  - mapping: |
                      root = this
                      root.is_duplicate = false
                      meta is_duplicate = false
              - catch:
                  - mapping: |
                      let collision = error().has_prefix("key already exists: ")
                      root = this
                      root.is_duplicate = if $collision { true } else { null }
                      root.error = if $collision { deleted() } else { error() }
                      meta is_duplicate = if $collision { "true" } else { "" }

      - catch:
          - mapping: |
              root = {"error": error(), "is_duplicate": null}

      # Step 5: Add dedup metadata
      - mapping: |
          root = this
          root.dedup_result = {
            "is_duplicate": this.is_duplicate,
            "dedup_key": meta("dedup_key"),
            "checked_at": now()
          }

  output:
    switch:
      cases:
      # New events → downstream processing
        - check: 'this.is_duplicate == false'
          output:
            kafka:
              addresses: ["${KAFKA_BROKERS}"]
              topic: unique-events
              ack_replicas: true
              tls:
                enabled: true
              sasl:
                mechanism: SCRAM-SHA-512
                user: "${KAFKA_USERNAME}"
                password: "${KAFKA_PASSWORD}"
              batching:
                count: 100
                period: 5s

      # Duplicates → metrics/logging only
        - output:
            file:
              path: "/var/expanso/duplicates/${!timestamp_unix_date('2006-01-02')}/dupes.jsonl"
              codec: lines

logger:
  level: INFO
  format: json

metrics:
  prometheus:
    path: /metrics
