<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Expanso Skills</title>
    <script>
        // SPA redirect for GitHub Pages / Cloudflare Pages
        // Routes like /skill/foo → index.html, whose landing script puts the path back. The
        // page that linked here goes along for analytics.js, and so do the query (campaign
        // tags) and the hash.
        var path = window.location.pathname;
        if (path.match(/^\/skill\/[^/]+\/?$/)) {
            try {
                sessionStorage.setItem('spa-redirect', path);
                sessionStorage.setItem('spa-referrer', document.referrer);
            } catch (e) {}
            window.location.replace('/' + window.location.search + window.location.hash);
        }
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
