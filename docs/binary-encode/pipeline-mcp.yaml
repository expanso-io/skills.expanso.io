name: "binary-encode-mcp"
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /encode
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.text == null
          root = if $missing {
            throw("required input is missing: text")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = this.text.or(content()).string().trim()

          let hex = $input.encode("hex")

          root.input = $input
          root.hex = $hex
          root.length = $input.length()
          root.byte_count = $hex.length() / 2
          root.metadata = {"skill": "binary-encode", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
