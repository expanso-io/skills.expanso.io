# Expanso Pipeline: sbom-generate (CLI mode)
# ============================================
#
# Generate SBOM from package manifest.
#
# Usage:
#   expanso-edge validate pipeline-cli.yaml
#
# Validates against: docs.expanso.io/schemas/pipeline.schema.json

name: sbom-generate-cli
type: pipeline

config:
  input:
    stdin:
      codec: lines
      max_buffer: 1048576

  pipeline:
    processors:
      - mapping: |
          let trace_id = uuid_v4()
          meta trace_id = $trace_id
          let format = env("FORMAT").or("cyclonedx").lowercase()

          let pkg = content().parse_json()

          # Extract dependencies
          let deps = $pkg.dependencies.or({})
          let dev_deps = $pkg.devDependencies.or({})

          # Build component list
          let components = $deps.key_values().map_each(dependency -> {
            "type": "library",
            "name": dependency.key,
            "version": dependency.value,
            "scope": "required"
          }).concat($dev_deps.key_values().map_each(dependency -> {
            "type": "library",
            "name": dependency.key,
            "version": dependency.value,
            "scope": "optional"
          }))

          let cyclonedx = {
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "serialNumber": "urn:uuid:" + $trace_id,
            "version": 1,
            "metadata": {
              "timestamp": now(),
              "component": {
                "type": "application",
                "name": $pkg.name.or("unknown"),
                "version": $pkg.version.or("0.0.0")
              }
            },
            "components": $components
          }
          let spdx_packages = $components.map_each(component -> {
            "SPDXID": "SPDXRef-Package-" + component.format_json().hash("sha256").encode("hex"),
            "name": component.name,
            "versionInfo": component.version,
            "downloadLocation": "NOASSERTION",
            "filesAnalyzed": false
          })
          let spdx = {
            "spdxVersion": "SPDX-2.3",
            "dataLicense": "CC0-1.0",
            "SPDXID": "SPDXRef-DOCUMENT",
            "name": $pkg.name.or("unknown"),
            "documentNamespace": "https://expanso.io/spdx/" + $trace_id,
            "creationInfo": {
              "created": now(),
              "creators": ["Tool: expanso-edge"]
            },
            "packages": $spdx_packages
          }

          root.sbom = if $format == "cyclonedx" {
            $cyclonedx
          } else if $format == "spdx" {
            $spdx
          } else {
            throw("unsupported SBOM format: " + $format)
          }
          root.metadata = {
            "skill": "sbom-generate",
            "mode": "cli",
            "format": $format,
            "component_count": $components.length(),
            "trace_id": $trace_id,
            "timestamp": now()
          }

      - log:
          level: INFO
          message: |
            [sbom-generate] Generated SBOM with ${! this.metadata.component_count } components (trace: ${! meta("trace_id").slice(0, 8) })

  output:
    stdout: {}
