# Nightly Database Backup Pipeline
# Simple, reliable replication to cloud storage for DR
#
# Use case: Nightly backup of orders and inventory tables from
# on-premise PostgreSQL to Google Cloud Storage
#
# Key features:
# - Full table extract via SQL
# - Minimal transformation (just add metadata)
# - Newline-delimited JSON with one checksum per source row
# - Date-partitioned storage for easy recovery
# - Checksum verification
#
# Expanso Edge v2.1.21 does include parquet_encode, but that processor requires
# an explicit column schema. This recipe selects wildcard table schemas, so it
# cannot truthfully emit Parquet until each table's columns and types are pinned
# in this file. The bundled gcp_cloud_storage output also has no storage_class
# field; configure Nearline or another lifecycle class on the bucket itself.

name: nightly-backup-orders
description: Backup orders and inventory to cloud cold storage
type: pipeline

config:
  input:
    # Sequence through multiple tables in one pipeline
    sequence:
      inputs:
        # Orders table
        - sql_select:
            driver: postgres  # Or: mysql, odbc, mssql
            dsn: "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}?sslmode=verify-full"
            table: orders
            columns: ["*"]
            where: "updated_at >= CURRENT_DATE - INTERVAL '1 day'"
          processors:
            - mapping: |
                root = this
                root._table = "orders"
                root._backup_type = "incremental"

        # Inventory table (full backup - smaller table)
        - sql_select:
            driver: postgres
            dsn: "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}?sslmode=verify-full"
            table: inventory
            columns: ["*"]
          processors:
            - mapping: |
                root = this
                root._table = "inventory"
                root._backup_type = "full"

        # Order line items
        - sql_select:
            driver: postgres
            dsn: "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}?sslmode=verify-full"
            table: order_items
            columns: ["*"]
            where: "created_at >= CURRENT_DATE - INTERVAL '1 day'"
          processors:
            - mapping: |
                root = this
                root._table = "order_items"
                root._backup_type = "incremental"

  pipeline:
    processors:
      # Step 1: Add backup metadata
      - mapping: |
          root = this
          root._backup_metadata = {
            "backup_date": now().format("2006-01-02"),
            "backup_timestamp": now(),
            "source_host": env("DB_HOST").or("unknown"),
            "source_database": env("DB_NAME").or("unknown"),
            "pipeline_version": "1.0.0",
            "node_id": env("NODE_ID").or("unknown")
          }

      # Step 2: Calculate row checksum for integrity verification
      - mapping: |
          root = this
          # Create checksum from all original fields (excluding metadata)
          let data_fields = this.without("_table", "_backup_type", "_backup_metadata")
          root._checksum = $data_fields.format_json().hash("md5")

  output:
    # Route to different paths based on table
    switch:
      cases:
        - check: this._table == "orders"
          output:
            gcp_cloud_storage:
              bucket: "${GCS_BACKUP_BUCKET}"
              path: "backups/orders/${!this._backup_metadata.backup_date}/orders-${!timestamp_unix()}.jsonl"
              content_type: application/x-ndjson
              batching:
                count: 10000
                period: 60s

        - check: this._table == "inventory"
          output:
            gcp_cloud_storage:
              bucket: "${GCS_BACKUP_BUCKET}"
              path: "backups/inventory/${!this._backup_metadata.backup_date}/inventory-full.jsonl"
              content_type: application/x-ndjson
              batching:
                count: 50000  # Inventory is full backup, larger batches
                period: 120s

        - check: this._table == "order_items"
          output:
            gcp_cloud_storage:
              bucket: "${GCS_BACKUP_BUCKET}"
              path: "backups/order_items/${!this._backup_metadata.backup_date}/items-${!timestamp_unix()}.jsonl"
              content_type: application/x-ndjson
              batching:
                count: 10000
                period: 60s

        # Fallback for unknown tables
        - output:
            gcp_cloud_storage:
              bucket: "${GCS_BACKUP_BUCKET}"
              path: "backups/unknown/${!this._table}/${!this._backup_metadata.backup_date}/data-${!timestamp_unix()}.json"
              content_type: application/json
              batching:
                count: 1000
                period: 30s
