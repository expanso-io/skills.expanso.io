name: Nightly latest Expanso conformance

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest:
    name: Latest Expanso Edge and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      edge_version: ${{ steps.versions.outputs.edge }}
      cli_version: ${{ steps.versions.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Test local Expanso tool detection
        run: scripts/test-require-expanso-tools.sh
      - name: Install latest Expanso Edge and CLI
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/expanso-bin"
          mkdir -p "$bin_dir"
          curl -fsSL https://get.expanso.io/edge/install.sh \
            | EXPANSO_INSTALL_DIR="$bin_dir" \
              USE_SUDO=false \
              bash
          curl -fsSL https://get.expanso.io/cli/install.sh \
            | EXPANSO_INSTALL_DIR="$bin_dir" \
              USE_SUDO=false \
              bash
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Record exact versions
        id: versions
        run: |
          scripts/require-expanso-tools.sh
          echo "edge=$(expanso-edge version 2>&1 | head -n 1)" \
            >> "$GITHUB_OUTPUT"
          echo "cli=$(expanso-cli version 2>&1 | head -n 1)" \
            >> "$GITHUB_OUTPUT"
      - name: Validate and execute every published example
        run: |
          scripts/run-edge-conformance.sh \
            generate \
            .conformance/nightly
      - name: Upload exact-version reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-latest-reports
          path: |
            .conformance/nightly/
            .conformance/full-cli.json
            .conformance/full-mcp.json
            .conformance/negative-inputs.json
            .conformance/recipe-execution.json
          if-no-files-found: warn

  track-failure:
    name: Track latest Expanso failures
    if: always()
    needs: [latest]
    runs-on: ubuntu-latest
    steps:
      - name: Open, update, or close the single tracking issue
        uses: actions/github-script@v7
        env:
          LATEST_RESULT: ${{ needs.latest.result }}
          EDGE_VERSION: ${{ needs.latest.outputs.edge_version }}
          CLI_VERSION: ${{ needs.latest.outputs.cli_version }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'expanso-edge-drift';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'B91C1C',
                description: 'Latest Expanso release breaks published examples'
              });
            }
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: label, per_page: 100 }
            );
            const issue = issues.find((item) => !item.pull_request);
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (process.env.LATEST_RESULT !== 'success') {
              const title = 'Latest Expanso release breaks public example conformance';
              const body = [
                'The latest-only nightly conformance run failed.',
                '',
                `Edge: ${process.env.EDGE_VERSION || 'unresolved'}`,
                `CLI: ${process.env.CLI_VERSION || 'unresolved'}`,
                '',
                `[Nightly run](${runUrl})`,
                '',
                'This issue is updated in place and closes after latest is green.'
              ].join('\n');
              if (issue) {
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, title, body
                });
              } else {
                await github.rest.issues.create({
                  owner, repo, title, body, labels: [label]
                });
              }
            } else if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Latest Expanso is green again: ${runUrl}`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed'
              });
            }
