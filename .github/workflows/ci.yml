name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d relaxed skills/ || true

      - name: Validate skill structure
        run: |
          echo "Checking skill directory structure..."
          ERRORS=0

          for category_dir in skills/*/; do
            for skill_dir in "$category_dir"*/; do
              if [ -d "$skill_dir" ]; then
                # Recipes use pipeline.yaml; standard skills use skill.yaml + pipeline-cli.yaml
                HAS_PIPELINE=0

                [ -f "$skill_dir/pipeline-cli.yaml" ] && HAS_PIPELINE=1
                [ -f "$skill_dir/pipeline-mcp.yaml" ] && HAS_PIPELINE=1
                [ -f "$skill_dir/pipeline.yaml" ] && HAS_PIPELINE=1

                if [ "$HAS_PIPELINE" -eq 0 ]; then
                  echo "❌ Missing pipeline YAML in $skill_dir"
                  ERRORS=$((ERRORS + 1))
                fi
              fi
            done
          done

          SKILL_COUNT=$(find skills -name "skill.yaml" -o -name "pipeline.yaml" | wc -l)
          echo "✅ Validated $SKILL_COUNT skills"

          if [ "$ERRORS" -gt 0 ]; then
            echo "Found $ERRORS structural errors"
            exit 1
          fi

      - name: Validate pipeline job specs (expanso-cli)
        # Repository-owned command lives in scripts/validate-pipelines.sh so it
        # can be reproduced locally before pushing. Fail-closed: if the
        # validator cannot be installed or run, this FAILS rather than passing
        # by skipping. It previously skipped silently because its installer URL
        # 404'd, so no pipeline was ever actually validated on a green run.
        #
        # Scope: job-spec structure only. It does not prove a pipeline's inner
        # component configuration is valid; `expanso-edge validate` is stricter
        # and still rejects most recipes.
        run: ./scripts/validate-pipelines.sh

      - name: Run skills audit
        run: |
          if command -v uv &>/dev/null; then
            uv run -s scripts/audit-skills.py
          elif [ -f scripts/audit-skills.py ]; then
            python3 scripts/audit-skills.py
          else
            echo "⚠️  Audit script not found — skipping"
          fi

      - name: Check Claude plugin (plugin/)
        # Fails if plugin/skills/find-expanso-skill/references/proven-jobs.md
        # drifts from skills/jobs/*/skill.yaml, or if the plugin breaks a
        # directory pre-submission rule that can be checked offline.
        run: |
          pip install pyyaml
          python3 scripts/build-plugin.py --check

      - name: Validate catalog
        run: |
          if [ -f catalog.json ]; then
            python3 -c 'import json; data=json.load(open("catalog.json")); print("catalog.json valid —", len(data) if isinstance(data, list) else len(data.get("skills", [])), "entries")'
          fi
          if [ -f catalog-minimal.json ]; then
            python3 -c 'import json; json.load(open("catalog-minimal.json")); print("catalog-minimal.json valid")'
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build the consent runtime and the SDK core
        # Writes docs/js/consent-runtime.js and docs/js/array-<version>.js
        # (both git-ignored). Runs before the tag check below copies docs/,
        # so the check sees the built files.
        run: npm run build

      - name: Test the consent contract, the runtime bundle and the tag check
        run: npm test

      - name: Check the built site for retired analytics tags
        # Builds the per-skill pages the way pages.yml does, into a scratch
        # copy, and fails if GTM or the old ph.expanso.io proxy comes back,
        # or if the site does not serve the pinned posthog-js core.
        run: |
          SITE="$RUNNER_TEMP/site"
          cp -r docs "$SITE"
          python3 scripts/build-seo.py --catalog catalog.json --output "$SITE"
          python3 scripts/check-site-tags.py "$SITE"

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Copy the catalog and skills into docs/ (pages.yml's copy step)
        run: |
          cp catalog.json docs/
          cp catalog-minimal.json docs/
          if [ -f validation-report.json ]; then
            cp validation-report.json docs/
          fi
          for category_dir in skills/*/; do
            for skill_dir in "$category_dir"*/; do
              if [ -d "$skill_dir" ]; then
                cp -r "$skill_dir" "docs/$(basename "$skill_dir")"
              fi
            done
          done

      - name: Build the consent runtime and the SDK core
        run: npm run build

      - name: Run the browser tests
        # Serves https://skills.expanso.io/ from docs/ inside the test
        # browser; nothing reaches the network (tests/browser/harness.mjs).
        run: npm run test:browser
