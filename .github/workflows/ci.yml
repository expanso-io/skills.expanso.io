name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: Public example conformance
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned Expanso validators
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/expanso-bin"
          mkdir -p "$bin_dir"
          curl -fsSL https://get.expanso.io/edge/install.sh \
            | EXPANSO_INSTALL_DIR="$bin_dir" \
              EXPANSO_VERSION=v2.1.21 \
              USE_SUDO=false \
              bash
          curl -fsSL https://get.expanso.io/cli/install.sh \
            | EXPANSO_INSTALL_DIR="$bin_dir" \
              EXPANSO_VERSION=v2.1.21 \
              USE_SUDO=false \
              bash
          echo "$bin_dir" >> "$GITHUB_PATH"
          test "$("$bin_dir/expanso-edge" version)" = "v2.1.21"
          test "$("$bin_dir/expanso-cli" version)" = \
            "Expanso CLI version v2.1.21"

      - name: Validate YAML and skill structure
        run: |
          uv run -s scripts/audit-skills.py

      - name: Validate every job spec and pipeline config
        run: |
          ./scripts/validate-pipelines.sh
          uv run -s scripts/check-example-conformance.py
          uv run -s scripts/check-feature-preservation.py

      - name: Execute CLI variants on Expanso Edge
        run: |
          uv run -s scripts/test-skills.py \
            --variant cli \
            --no-cache \
            --max-reruns 1 \
            --report .conformance/full-cli.json

      - name: Execute MCP variants on Expanso Edge
        run: |
          uv run -s scripts/test-skills.py \
            --variant mcp \
            --no-cache \
            --max-reruns 1 \
            --report .conformance/full-mcp.json

      - name: Execute recipes and standalone variants on Expanso Edge
        run: |
          uv run -s scripts/test-recipes.py \
            --report .conformance/recipe-execution.json

      - name: Check generated reports and catalogs
        run: |
          uv run -s scripts/validate-skills.py --check
          uv run -s scripts/build-catalog.py --check
          uv run -s scripts/build-plugin.py --check
          uv run -s scripts/build-example-conformance.py --check

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test copy feedback, accessibility, and phone layout
        run: npm run test:site

      - name: Validate catalog
        run: |
          if [ -f catalog.json ]; then
            uv run python -c 'import json; data=json.load(open("catalog.json")); print("catalog.json valid —", len(data) if isinstance(data, list) else len(data.get("skills", [])), "entries")'
          fi
          if [ -f catalog-minimal.json ]; then
            uv run python -c 'import json; json.load(open("catalog-minimal.json")); print("catalog-minimal.json valid")'
          fi

      - name: Check the built site for retired analytics tags
        # Builds the per-skill pages the way pages.yml does, into a scratch
        # copy, and fails if GTM or the old ph.expanso.io proxy comes back.
        run: |
          SITE="$RUNNER_TEMP/site"
          cp -r docs "$SITE"
          uv run -s scripts/build-seo.py --catalog catalog.json --output "$SITE"
          uv run -s scripts/check-site-tags.py "$SITE"

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-conformance-evidence
          path: |
            .conformance/full-cli.json
            .conformance/full-mcp.json
            .conformance/recipe-execution.json
            playwright-report/
          if-no-files-found: error
