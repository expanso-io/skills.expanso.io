name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: Public example conformance
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether conformance inputs changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/conformance-changed.sh "$BASE_SHA"

      - name: Report fast no-op
        if: steps.changes.outputs.run != 'true'
        run: |
          echo "Public example conformance is unchanged."
          echo "The stable required-check job still reports success."

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        if: steps.changes.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned Expanso validators
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/expanso-bin"
          edge_version=$(<.github/expanso-edge-version)
          mkdir -p "$bin_dir"
          curl -fsSL https://get.expanso.io/edge/install.sh \
            | EXPANSO_INSTALL_DIR="$bin_dir" \
              EXPANSO_VERSION="$edge_version" \
              USE_SUDO=false \
              bash
          curl -fsSL https://get.expanso.io/cli/install.sh \
            | EXPANSO_INSTALL_DIR="$bin_dir" \
              EXPANSO_VERSION=v2.1.21 \
              USE_SUDO=false \
              bash
          echo "$bin_dir" >> "$GITHUB_PATH"
          test "$("$bin_dir/expanso-edge" version)" = "$edge_version"
          test "$("$bin_dir/expanso-cli" version)" = \
            "Expanso CLI version v2.1.21"

      - name: Validate and execute every published example
        if: steps.changes.outputs.run == 'true'
        run: scripts/run-edge-conformance.sh check

      - name: Check linked validation reports
        if: steps.changes.outputs.run == 'true'
        run: uv run -s scripts/render-validation-report.py --check

      - name: Install browser test dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm ci

      - name: Enforce bundled headless Chromium
        if: steps.changes.outputs.run == 'true'
        run: npm run check:browser-runtime

      - name: Install bundled Chromium
        if: steps.changes.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Stage and check published Pages artifacts
        if: steps.changes.outputs.run == 'true'
        run: |
          uv run -s scripts/stage-pages.py
          uv run -s scripts/test-pages-publication.py

      - name: Test copy feedback, classification, accessibility, and phone layout
        if: steps.changes.outputs.run == 'true'
        run: npm run test:site

      - name: Upload execution evidence
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: example-conformance-evidence
          path: |
            .conformance/full-cli.json
            .conformance/full-mcp.json
            .conformance/negative-inputs.json
            .conformance/recipe-execution.json
            playwright-report/
          if-no-files-found: error
