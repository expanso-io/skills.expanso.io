# Expanso Pipeline: webhook-receive (MCP mode)
# ==========================================
#
# HTTP server endpoint that receives webhook events.
# This is the primary mode — listens for incoming webhook POSTs.
#
# Usage:
#   expanso-edge validate pipeline-mcp.yaml
#   # Then configure your service to send webhooks to:
#   # http://your-edge-node:4195/webhook
#
#   # With signature verification:
#   expanso-edge validate pipeline-mcp.yaml

name: webhook-receive-mcp
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-4195}"
      path: /webhook
      allowed_verbs: [POST]

  pipeline:
    processors:
      # ═══════════════════════════════════════════════════════════════════════
      # STEP 1: Parse and extract event metadata
      # ═══════════════════════════════════════════════════════════════════════
      - try:
          - mapping: |
              meta trace_id = uuid_v4()
              meta start_time = now()
              meta raw_body = content()

              let body = content().parse_json()

              # The http_server input exposes request headers under their canonical
              # HTTP names (for example, X-Github-Event), not an http_header_ prefix.
              let event_type = meta("X-Github-Event").or(meta("X-Stripe-Event")).or(meta("X-Event-Type")).or("unknown")
              meta event_type = $event_type

              root.event = {
                "type": $event_type,
                "body": $body,
                "source_ip": meta("http_server_remote_ip").or("unknown"),
                "received_at": now()
              }

          # ═══════════════════════════════════════════════════════════════════════
          # STEP 2: Signature verification (fail-closed)
          # ═══════════════════════════════════════════════════════════════════════
          - mapping: |
              let secret = env("WEBHOOK_SECRET").or("")
              let sig_header_name = env("WEBHOOK_SIGNATURE_HEADER").or("X-Hub-Signature-256")
              let provided_sig = meta($sig_header_name).or("")
              let expected = "sha256=" + meta("raw_body").hash("hmac_sha256", $secret).encode("hex")
              let verified = $secret != "" && $provided_sig != "" && $expected == $provided_sig
              meta signature_status = if $verified { "verified" } else { "rejected" }
              root = if !$verified {
                deleted()
              } else {
                this
              }

      - catch:
          - mapping: root = deleted()

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 3: Structure output with canonical envelope
      # ═══════════════════════════════════════════════════════════════════════
      - mapping: |
          root.source = "webhook"
          root.event = this.event
          root.resource = "event." + meta("event_type")
          root.schema_version = "1.0"
          root.trace_id = meta("trace_id")
          root.data = [this.event]
          root.count = 1
          root.sensitivity = "raw"
          root.metadata = {
            "skill": "webhook-receive",
            "mode": "mcp",
            "event_type": meta("event_type"),
            "signature_status": meta("signature_status"),
            "source_ip": this.event.source_ip,
            "trace_id": meta("trace_id").or(uuid_v4()),
            "timestamp": now()
          }

      - log:
          level: INFO
          message: |
            [webhook-receive] Processed event type=${! meta("event_type") } sig=${! meta("signature_status") } (trace: ${! meta("trace_id").slice(0, 8) })

  output:
    sync_response: {}
