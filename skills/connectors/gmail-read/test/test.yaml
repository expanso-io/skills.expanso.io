tests:
  - name: "Normalizes Gmail API list and metadata responses"
    input: '{"query":"is:unread","label":"INBOX"}'
    provider_responses:
      - messages:
          - id: m-1
        resultSizeEstimate: 1
      - id: m-1
        snippet: All systems nominal
        labelIds: [INBOX, UNREAD]
        payload:
          headers:
            - name: Subject
              value: Status
            - name: From
              value: team@example.test
            - name: To
              value: me@example.test
            - name: Date
              value: "2026-10-05"
          parts: []
    expected_output:
      source: gmail
      resource: messages
      count: 1
      data:
        - id: m-1
          subject: Status
          from: team@example.test
          to: me@example.test
          date: "2026-10-05"
          snippet: All systems nominal
          labels: [INBOX, UNREAD]
          has_attachment: false
      metadata:
        source: gmail_api
        email_count: 1
        total_estimated: 1
