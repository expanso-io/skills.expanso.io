tests:
  - name: "Returns explicit normalized Gmail fixtures"
    input: '{"query":"is:unread","label":"INBOX","fixture_mode":true,"fixture_emails":[{"id":"m-1","subject":"Status","from":"team@example.test","to":"me@example.test","date":"2026-10-05","snippet":"All systems nominal","labels":["INBOX","UNREAD"],"has_attachment":false}]}'
    expected_output:
      source: gmail
      resource: messages
      count: 1
      data:
        - id: m-1
          subject: Status
          from: team@example.test
          to: me@example.test
          date: "2026-10-05"
          snippet: All systems nominal
          labels: [INBOX, UNREAD]
          has_attachment: false
      metadata:
        fixture: true
        email_count: 1
        total_estimated: 1
