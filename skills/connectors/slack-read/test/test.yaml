tests:
  - name: "Reads and filters explicit Slack fixtures"
    input: '{"channel":"C01234567","query":"deploy","fixture_mode":true,"fixture_messages":[{"ts":"1.0","user":"U1","text":"deploy finished"},{"ts":"2.0","user":"U2","text":"standup notes"}]}'
    expected_output:
      source: slack
      resource: conversations.history
      count: 1
      data:
        - id: "1.0"
          user: U1
          text: deploy finished
          timestamp: "1.0"
          thread_ts: null
          reactions: []
      metadata:
        success: true
        fixture: true
        total_available: 2
