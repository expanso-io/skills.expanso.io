# Expanso Pipeline: policy-check (CLI mode)

name: policy-check-cli
type: pipeline

config:
  input:
    stdin:
      codec: lines

  pipeline:
    processors:
      - mapping: |
          root = {"status": "unsupported", "publication": "pulled", "skill": "policy-check", "reason": "Reports policy approval and checked rules without evaluating the configured rules."}

  output:
    stdout: {}
