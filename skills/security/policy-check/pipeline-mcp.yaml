# Expanso Pipeline: policy-check (MCP mode)

name: policy-check-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /check
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          root = {"status": "unsupported", "publication": "pulled", "skill": "policy-check", "reason": "Reports policy approval and checked rules without evaluating the configured rules."}

  output:
    sync_response: {}
