# Expanso Pipeline: jwt-verify (MCP mode)
# ==========================================
#
# HTTP endpoint for JWT verification.
#
# Usage:
#   expanso-edge validate pipeline-mcp.yaml
#
#   curl -X POST http://localhost:8080/verify \
#     -H "Content-Type: application/json" \
#     -d '{"token": "eyJ..."}'
#
# Validates against: docs.expanso.io/schemas/pipeline.schema.json

name: jwt-verify-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /verify
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          root = {"status": "unsupported", "publication": "pulled", "skill": "jwt-verify", "reason": "Reports tokens as valid without verifying their cryptographic signatures."}

  output:
    sync_response: {}
