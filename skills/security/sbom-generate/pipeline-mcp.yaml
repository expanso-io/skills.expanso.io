# Expanso Pipeline: sbom-generate (MCP mode)
# =============================================
#
# HTTP endpoint for SBOM generation.
#
# Usage:
#   expanso-edge validate pipeline-mcp.yaml
#
#   curl -X POST http://localhost:8080/generate \
#     -H "Content-Type: application/json" \
#     -d '{"packages": {"name":"myapp","dependencies":{...}}}'
#
# Validates against: docs.expanso.io/schemas/pipeline.schema.json

name: sbom-generate-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /generate
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let pkg = this.packages
          let format = this.format.or("cyclonedx").lowercase()
          let trace_id = uuid_v4()
          meta trace_id = $trace_id

          root = if $pkg == null {
            throw("packages field is required")
          } else { {} }

          let deps = $pkg.dependencies.or({})
          let dev_deps = $pkg.devDependencies.or({})

          let components = $deps.keys().map_each(name -> {
            "type": "library",
            "name": name,
            "version": $deps.get(name),
            "scope": "required"
          }).concat($dev_deps.keys().map_each(name -> {
            "type": "library",
            "name": name,
            "version": $dev_deps.get(name),
            "scope": "optional"
          }))

          let cyclonedx = {
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "serialNumber": "urn:uuid:" + $trace_id,
            "version": 1,
            "metadata": {
              "timestamp": now(),
              "component": {
                "type": "application",
                "name": $pkg.name.or("unknown"),
                "version": $pkg.version.or("0.0.0")
              }
            },
            "components": $components
          }
          let spdx_packages = $components.map_each(component -> {
            "SPDXID": "SPDXRef-Package-" + component.name.replace_all("[^A-Za-z0-9.-]", "-"),
            "name": component.name,
            "versionInfo": component.version,
            "downloadLocation": "NOASSERTION",
            "filesAnalyzed": false
          })
          let spdx = {
            "spdxVersion": "SPDX-2.3",
            "dataLicense": "CC0-1.0",
            "SPDXID": "SPDXRef-DOCUMENT",
            "name": $pkg.name.or("unknown"),
            "documentNamespace": "https://expanso.io/spdx/" + $trace_id,
            "creationInfo": {
              "created": now(),
              "creators": ["Tool: expanso-edge"]
            },
            "packages": $spdx_packages
          }

          root.sbom = if $format == "cyclonedx" {
            $cyclonedx
          } else if $format == "spdx" {
            $spdx
          } else {
            throw("unsupported SBOM format: " + $format)
          }
          root.metadata = {
            "skill": "sbom-generate",
            "mode": "mcp",
            "format": $format,
            "component_count": $components.length(),
            "trace_id": $trace_id,
            "timestamp": now()
          }

      - log:
          level: INFO
          message: |
            [sbom-generate] MCP: ${! this.metadata.component_count } components (trace: ${! meta("trace_id").slice(0, 8) })

  output:
    sync_response: {}
