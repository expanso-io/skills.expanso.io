name: transform-formats-complete
type: pipeline
description: Complete Format Transformation Pipeline - Transforms between JSON, CSV, and XML formats with auto-detection.
namespace: production
labels:
  category: data-transformation
  pattern: format-transformation

config:
  input:
    http_server:
      address: "0.0.0.0:8080"
      path: /transform
      allowed_verbs: ["POST"]

  pipeline:
    processors:
      # Step 1: Detect input format from Content-Type or structure
      - mapping: |
          let content = this.string()
          let source_format = if $content.has_prefix("{") || $content.has_prefix("[") {
            "json"
          } else if $content.has_prefix("<?xml") || $content.has_prefix("<") {
            "xml"
          } else if $content.contains(",") {
            "csv"
          } else {
            "text"
          }

          root = this
          root.source_format = $source_format
          root.raw = $content
          meta source_format = $source_format

      # Step 2: Parse to normalized structure
      - switch:
          - check: 'meta("source_format") == "json"'
            processors:
              - mapping: 'root = this.raw.parse_json()'

          - check: 'meta("source_format") == "xml"'
            processors:
              - mapping: 'root = this.raw'
              - xml:
                  operator: to_json

          - check: 'meta("source_format") == "csv"'
            processors:
              - mapping: 'root = this.raw.parse_csv()'

      # Step 3: Transform to target format (based on Accept header or default)
      - mapping: |
          let target = meta("Accept").or("application/json")
          let target_format = if $target.contains("xml") {
            "xml"
          } else if $target.contains("csv") {
            "csv"
          } else {
            "json"
          }

          root = this
          meta target_format = $target_format

      # Step 4: Encode to target format
      - switch:
          - check: 'meta("target_format") == "xml"'
            processors:
              - mapping: 'root = this.format_xml()'

          - check: 'meta("target_format") == "csv"'
            processors:
              - mapping: |
                  let rows = if this.type() == "array" { this } else { [this] }
                  let first = $rows.index(0)
                  let keys = if $first.type() == "object" { $first.keys().sort() } else { ["value"] }
                  let header = $keys.map_each(key -> "\"" + key.replace_all("\"", "\"\"") + "\"").join(",")
                  let data_rows = $rows.map_each(row -> $keys.map_each(key -> "\"" + row.key_values().filter(entry -> entry.key == key).index(0).value.string().replace_all("\"", "\"\"") + "\"").join(","))
                  root = $header + "\n" + $data_rows.join("\n")

      # Step 5: Add transformation metadata
      - mapping: |
          root.data = if meta("target_format") == "json" { this } else { content().string() }
          root.transformation = {
            "source_format": meta("source_format"),
            "target_format": meta("target_format"),
            "transformed_at": now()
          }

  output:
    sync_response: {}

logger:
  level: INFO
  format: json

metrics:
  prometheus:
    path: /metrics
