name: content-splitting-complete
type: pipeline
description: Complete Content Splitting Pipeline - Splits batch payloads (arrays, CSVs) into individual records for processing.
namespace: production
labels:
  category: data-routing
  pattern: content-splitting

config:
  input:
    http_server:
      address: "0.0.0.0:8080"
      path: /batch
      allowed_verbs: ["POST"]

  pipeline:
    processors:
      # Step 1: Detect content type and validate
      - mapping: |
          let batch_id = uuid_v4()
          let data_type = if this.items != null && this.items.type() == "array" {
            "json_array"
          } else if this.records != null {
            "records"
          } else if this.type() == "array" {
            "raw_array"
          } else {
            "single"
          }

          root = this
          root.batch_id = $batch_id
          root.received_at = now()
          root.data_type = $data_type

          meta data_type = $data_type
          meta batch_id = $batch_id

      # Step 2: Extract items to split
      - mapping: |
          let items = if this.data_type == "json_array" {
            this.items
          } else if this.data_type == "records" {
            this.records
          } else if this.data_type == "raw_array" {
            this
          } else {
            [this]
          }
          root = $items
          meta item_count = $items.length()

      # Step 3: Split array into individual messages
      - unarchive:
          format: json_array

      # Step 4: Enrich each item with batch context
      - mapping: |
          root = this
          root.batch_context = {
            "batch_id": meta("batch_id"),
            "item_index": count("items"),
            "total_items": meta("item_count"),
            "split_at": now()
          }

      # Step 5: Validate individual items
      - mapping: |
          let valid = this.type() == "object" && this.keys().length() > 0
          root = if $valid { this } else { {"invalid": true, "original": this} }

          meta is_valid = $valid

  output:
    switch:
      cases:
      # Valid items → processing queue
        - check: 'meta("is_valid") == true'
          output:
            kafka:
              addresses: ["${KAFKA_BROKERS}"]
              topic: processed-items
              ack_replicas: true
              tls:
                enabled: true
              sasl:
                mechanism: SCRAM-SHA-512
                user: "${KAFKA_USERNAME}"
                password: "${KAFKA_PASSWORD}"
              batching:
                count: 100
                period: 5s

      # Invalid items → DLQ
        - output:
            file:
              path: "/var/expanso/dlq/${!timestamp_unix_date('2006-01-02')}/invalid-items.jsonl"
              codec: lines

logger:
  level: INFO
  format: json

metrics:
  prometheus:
    path: /metrics
