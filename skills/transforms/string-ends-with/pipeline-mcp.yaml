name: "string-ends-with-mcp"
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /check
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.text == null || this.suffix == null
          root = if $missing {
            throw("required input is missing: text, suffix")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let text = this.text.or("").string()
          let suffix = this.suffix.or("").string()

          root.ends_with = $text.has_suffix($suffix)
          root.text = $text
          root.suffix = $suffix
          root.metadata = {"skill": "string-ends-with", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
