name: "text-reverse-cli"
type: pipeline

config:
  input:
    stdin:
      codec: all
      max_buffer: 1048576

  pipeline:
    processors:
      - mapping: |
          root = if content().length() == 0 {
            throw("input is required")
          } else {
            content()
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = content().trim()

          # Reverse by splitting into chars and joining
          let chars = $input.split("")
          let reversed = $chars.fold("", pair -> pair.value + pair.tally)

          root.reversed = $reversed
          root.input = $input
          root.length = $input.length()
          root.is_palindrome = $input.lowercase() == $reversed.lowercase()
          root.metadata = {"skill": "text-reverse", "mode": "cli", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    stdout: {}
