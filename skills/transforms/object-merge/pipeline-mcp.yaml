name: "object-merge-mcp"
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /merge
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.objects == null
          root = if $missing {
            throw("required input is missing: objects")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = this.objects.or(content()).string().trim()
          let parsed = $input.parse_json().catch(null)

          let merged = if $parsed.type() == "array" {
            $parsed.fold({}, pair -> pair.tally.merge(pair.value))
          } else if $parsed.type() == "object" {
            $parsed
          } else {
            {}
          }

          root.merged = $merged
          root.count = if $parsed.type() == "array" { $parsed.length() } else { 1 }
          root.valid = $parsed != null
          root.error = if $parsed == null { "Invalid JSON input" } else { "" }
          root.metadata = {"skill": "object-merge", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
