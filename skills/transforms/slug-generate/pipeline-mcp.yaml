# Expanso Pipeline: slug-generate (MCP mode)
# ===========================================
#
# Usage:
#   expanso-edge validate pipeline-mcp.yaml
#   curl -X POST http://localhost:8080/slugify -d '{"text": "Hello World!"}'

name: "slug-generate-mcp"
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /slugify
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.text == null
          root = if $missing {
            throw("required input is missing: text")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let text = this.text.or(content())
          let separator = this.separator.or("-")

          let slug = $text.lowercase().replace_all($separator, " ")
          let slug = $slug.re_replace_all("[^a-z0-9\\s]", "")
          let slug = $slug.re_replace_all("\\s+", " ").trim()
          let slug = $slug.split(" ").join($separator)

          root.slug = $slug
          root.original = $text
          root.separator = $separator
          root.metadata = {
            "skill": "slug-generate",
            "mode": "mcp",
            "trace_id": meta("trace_id").or(uuid_v4()),
            "timestamp": now()
          }

      - log:
          level: INFO
          message: |
            [slug-generate] Generated slug (trace: ${! meta("trace_id").slice(0, 8) })

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
