# Expanso Pipeline: slug-generate (CLI mode)
# ===========================================
#
# Usage:
#   expanso-edge validate pipeline-cli.yaml
#   expanso-edge validate pipeline-cli.yaml
#
# No API key needed - runs entirely locally.

name: "slug-generate-cli"
type: pipeline

config:
  input:
    stdin:
      codec: all
      max_buffer: 1048576

  pipeline:
    processors:
      - mapping: |
          meta trace_id = uuid_v4()
          let separator = env("SEPARATOR").or("-")
          meta separator = $separator
          let text = content().trim()

          # Convert to slug
          let slug = $text.lowercase().replace_all($separator, " ")
          let slug = $slug.re_replace_all("[^a-z0-9\\s]", "")
          let slug = $slug.re_replace_all("\\s+", " ").trim()
          let slug = $slug.split(" ").join($separator)

          root.slug = $slug
          root.original = $text
          root.separator = $separator
          root.metadata = {
            "skill": "slug-generate",
            "mode": "cli",
            "trace_id": meta("trace_id").or(uuid_v4()),
            "timestamp": now()
          }

      - log:
          level: INFO
          message: |
            [slug-generate] "${! this.original }" -> "${! this.slug }" (trace: ${! meta("trace_id").slice(0, 8) })

  output:
    stdout: {}
