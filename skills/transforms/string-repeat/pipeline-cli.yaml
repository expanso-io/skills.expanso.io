name: "string-repeat-cli"
type: pipeline

config:
  input:
    stdin:
      codec: all
      max_buffer: 10240

  pipeline:
    processors:
      - mapping: |
          root = if content().length() == 0 {
            throw("input is required")
          } else {
            content()
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = content().trim()
          let count = 3

          # Repeat by concatenating
          let repeated = $input + $input + $input

          root.original = $input
          root.repeated = $repeated
          root.count = $count
          root.original_length = $input.length()
          root.repeated_length = $repeated.length()
          root.metadata = {"skill": "string-repeat", "mode": "cli", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    stdout: {}
