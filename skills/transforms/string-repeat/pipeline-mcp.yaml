name: "string-repeat-mcp"
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /repeat
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.text == null
          root = if $missing {
            throw("required input is missing: text")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = this.text.or(content()).string().trim()
          let count = this.count.or(3).number()

          let repeated = $input + $input + $input

          root.original = $input
          root.repeated = $repeated
          root.count = $count
          root.original_length = $input.length()
          root.repeated_length = $repeated.length()
          root.metadata = {"skill": "string-repeat", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
