name: "json-merge-mcp"
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /merge
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.objects == null
          root = if $missing {
            throw("required input is missing: objects")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = this.objects.or(content())

          let parsed = if $input.type() == "array" { $input } else { $input.parse_json().catch([]) }
          let is_array = $parsed.type() == "array"

          let merged = if $is_array { $parsed.fold({}, pair -> pair.tally.merge(pair.value)) } else { $parsed }

          root.merged = $merged
          root.object_count = if $is_array { $parsed.length() } else { 1 }
          root.valid = true
          root.metadata = {"skill": "json-merge", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
