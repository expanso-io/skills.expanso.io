name: "json-to-yaml-mcp"
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /convert
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.json == null
          root = if $missing {
            throw("required input is missing: json")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = this.json.or(content()).string().trim()
          let parsed = $input.parse_json().catch(null)

          root.yaml = if $parsed != null { $parsed.format_yaml() } else { "" }
          root.valid = $parsed != null
          root.error = if $parsed == null { "Invalid JSON input" } else { "" }
          root.metadata = {"skill": "json-to-yaml", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
