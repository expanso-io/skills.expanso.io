name: "text-lines-mcp"
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /lines
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.text == null
          root = if $missing {
            throw("required input is missing: text")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = this.text.or(content()).string()

          let lines = $input.split("\n")
          let non_empty = $lines.filter(l -> l.trim() != "")

          root.lines = $lines
          root.line_count = $lines.length()
          root.non_empty_count = $non_empty.length()
          root.metadata = {"skill": "text-lines", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
