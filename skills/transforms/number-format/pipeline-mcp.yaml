name: "number-format-mcp"
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /format
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.number == null
          root = if $missing {
            throw("required input is missing: number")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let num = this.number.or(0).number().catch(0)
          let format = this.format.or("standard")

          let formatted = match $format {
            "currency" => "$" + $num.string(),
            "percent" => ($num * 100).string() + "%",
            "scientific" => $num.string(),
            _ => $num.string()
          }

          root.formatted = $formatted
          root.original = $num
          root.format = $format
          root.metadata = {"skill": "number-format", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
