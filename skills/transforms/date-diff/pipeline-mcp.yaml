name: "date-diff-mcp"
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /diff
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.start == null || this.end == null
          root = if $missing {
            throw("required input is missing: start, end")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let start = this.start.or(now())
          let end = this.end.or(now())

          root.start = $start
          root.end = $end
          root.diff_seconds = ($end.ts_unix() - $start.ts_unix())
          root.diff_hours = root.diff_seconds / 3600
          root.diff_days = root.diff_seconds / 86400
          root.metadata = {"skill": "date-diff", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
