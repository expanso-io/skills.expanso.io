# Test cases for json-to-csv skill

tests:
  - name: "Convert JSON array"
    input: '[{"name":"Alice","age":30}]'
    expected:
      has_field: [csv, row_count, columns]
      metadata_has: [skill, trace_id, timestamp]

  - name: "Preserves dotted literal keys"
    input: '[{"a.b":1},{"a.b":2}]'
    expected_output:
      csv: "a.b\n1\n2"
      columns: ["a.b"]
      row_count: 2
