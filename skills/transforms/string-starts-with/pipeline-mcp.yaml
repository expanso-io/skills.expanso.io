name: "string-starts-with-mcp"
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /check
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.text == null || this.prefix == null
          root = if $missing {
            throw("required input is missing: text, prefix")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let text = this.text.or("").string()
          let prefix = this.prefix.or("").string()

          root.starts_with = $text.has_prefix($prefix)
          root.text = $text
          root.prefix = $prefix
          root.metadata = {"skill": "string-starts-with", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
