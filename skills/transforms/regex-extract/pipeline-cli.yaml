# Expanso Pipeline: regex-extract (CLI mode)
# ===========================================
#
# Usage:
#   expanso-edge validate pipeline-cli.yaml
#
# No API key needed - runs entirely locally.

name: "regex-extract-cli"
type: pipeline

config:
  input:
    stdin:
      codec: all
      max_buffer: 10485760

  pipeline:
    processors:
      - mapping: |
          meta trace_id = uuid_v4()
          let text = content().string()
          let pattern = env("PATTERN").or("\\S+")

          # Find all matches
          let matches = $text.re_find_all($pattern)

          root.matches = $matches
          root.count = $matches.length()
          root.has_match = $matches.length() > 0
          root.pattern = $pattern
          root.metadata = {
            "skill": "regex-extract",
            "mode": "cli",
            "trace_id": meta("trace_id").or(uuid_v4()),
            "timestamp": now()
          }

      - log:
          level: INFO
          message: |
            [regex-extract] Found ${! this.count } matches (trace: ${! meta("trace_id").slice(0, 8) })

  output:
    stdout: {}
