name: "json-compact-mcp"
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /compact
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.json == null
          root = if $missing {
            throw("required input is missing: json")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = this.json.or(content()).string().trim()

          let parsed = $input.parse_json().catch(null)
          let valid = $parsed != null

          let compact = if $valid { $parsed.format_json() } else { "" }

          root.original_length = $input.length()
          root.compact = $compact
          root.compact_length = $compact.length()
          root.savings = $input.length() - $compact.length()
          root.valid = $valid
          root.metadata = {"skill": "json-compact", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
