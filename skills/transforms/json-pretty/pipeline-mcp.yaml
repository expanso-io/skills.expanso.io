name: "json-pretty-mcp"
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /format
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.json == null
          root = if $missing {
            throw("required input is missing: json")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let json_str = this.json.or(content()).string()
          let parsed = $json_str.parse_json()
          root.formatted = $parsed.format_json().string()
          root.valid = true
          root.metadata = {"skill": "json-pretty", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
