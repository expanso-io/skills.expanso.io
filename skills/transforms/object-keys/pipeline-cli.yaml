name: "object-keys-cli"
type: pipeline

config:
  input:
    stdin:
      codec: all
      max_buffer: 1048576

  pipeline:
    processors:
      - mapping: |
          root = if content().length() == 0 {
            throw("input is required")
          } else {
            content()
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = content().trim()

          let parsed = $input.parse_json().catch({})
          let is_object = $parsed.type() == "object"

          let keys = if $is_object { $parsed.keys() } else { [] }
          let values = if $is_object { $parsed.values() } else { [] }

          root.keys = $keys
          root.values = $values
          root.count = $keys.length()
          root.valid = $is_object
          root.metadata = {"skill": "object-keys", "mode": "cli", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    stdout: {}
