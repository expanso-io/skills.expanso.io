name: "text-indent-cli"
type: pipeline

config:
  input:
    stdin:
      codec: all
      max_buffer: 10485760

  pipeline:
    processors:
      - mapping: |
          root = if content().length() == 0 {
            throw("input is required")
          } else {
            content()
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = content().string()
          let lines = $input.split("\n")

          # Add 2-space indent to each line
          let indented = $lines.map_each(l -> "  " + l).join("\n")

          # Add 4-space indent
          let indented_4 = $lines.map_each(l -> "    " + l).join("\n")

          root.original = $input
          root.indented_2 = $indented
          root.indented_4 = $indented_4
          root.line_count = $lines.length()
          root.metadata = {"skill": "text-indent", "mode": "cli", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    stdout: {}
