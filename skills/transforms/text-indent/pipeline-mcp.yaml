name: "text-indent-mcp"
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /indent
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let missing = this.text == null
          root = if $missing {
            throw("required input is missing: text")
          } else {
            this
          }
      - mapping: |
          meta trace_id = uuid_v4()
          let input = this.text.or(content()).string()
          let lines = $input.split("\n")

          let indented_2 = $lines.map_each(l -> "  " + l).join("\n")
          let indented_4 = $lines.map_each(l -> "    " + l).join("\n")

          root.original = $input
          root.indented_2 = $indented_2
          root.indented_4 = $indented_4
          root.line_count = $lines.length()
          root.metadata = {"skill": "text-indent", "mode": "mcp", "trace_id": meta("trace_id").or(uuid_v4()), "timestamp": now()}

      - catch:
          - mapping: |
              meta http_status_code = 400
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
