# Expanso Pipeline: health-integrate (MCP mode)

name: health-integrate-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /health
      allowed_verbs: [POST]
      timeout: 60s

  pipeline:
    processors:
      - mapping: |
          root = {"status": "unsupported", "publication": "pulled", "skill": "health-integrate", "reason": "Fabricates wearable health observations and calendar recommendations without reading supplied data or integrating providers."}

  output:
    sync_response: {}
