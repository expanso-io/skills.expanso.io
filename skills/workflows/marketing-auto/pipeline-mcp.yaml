# Expanso Pipeline: marketing-auto (MCP mode)

name: marketing-auto-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /marketing
      allowed_verbs: [POST]
      timeout: 120s

  pipeline:
    processors:
      - mapping: |
          root = {"status": "unsupported", "publication": "pulled", "skill": "marketing-auto", "reason": "Fabricates campaign content, scheduling, and analytics without generating content or invoking marketing services."}

  output:
    sync_response: {}
