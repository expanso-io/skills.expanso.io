# Expanso Pipeline: email-triage (CLI mode)
# ==========================================
#
# Intelligent email triage with AI-powered categorization.
#
# Usage:
#   # Process Gmail inbox
#   expanso-edge validate pipeline-cli.yaml
#
#   # Process with calendar sync
#   expanso-edge validate pipeline-cli.yaml
#
# Why Expanso Edge?
#   Credentials are read from the executing node's environment, not sent to
#   Expanso Cloud. Each is sent to its own provider's API. The AI provider
#   receives email content, not your mail credentials.
#   Full audit trail of what was processed and why.
#
# Validates against: docs.expanso.io/schemas/pipeline.schema.json

name: email-triage-cli
type: pipeline

config:
  input:
    stdin:
      codec: lines

  pipeline:
    processors:
      # ═══════════════════════════════════════════════════════════════════════
      # STEP 1: Parse input and initialize
      # ═══════════════════════════════════════════════════════════════════════
      - try:
          - mapping: |
              let trace_id = uuid_v4()
              let start_time = now()
              meta trace_id = $trace_id
              meta start_time = $start_time

              let input = content().parse_json()
              let provider = $input.provider.or("gmail")
              let folder = $input.folder.or("INBOX")
              let limit = $input.limit.or(50)
              let since_hours = $input.since_hours.or(24)
              meta provider = $provider
              meta folder = $folder
              meta limit = $limit
              meta since_hours = $since_hours
              meta extract_calendar_events = $input.extract_calendar_events.or(true)

              # Calculate date filter
              let since_date = (now().ts_unix() - ($since_hours * 3600)).ts_format("2006-01-02T15:04:05Z07:00")
              meta since_date = $since_date

              root.status = "initializing"
              root.provider = $provider

          - log:
              level: INFO
              message: |
                [email-triage] Starting triage: provider=${! meta("provider") }, folder=${! meta("folder") }, limit=${! meta("limit") } (trace: ${! meta("trace_id").slice(0, 8) })

          # ═══════════════════════════════════════════════════════════════════════
          # STEP 2: Fetch normalized email records from the selected provider
          # ═══════════════════════════════════════════════════════════════════════
          - switch:
              - check: 'meta("provider") == "gmail"'
                processors:
                  - try:
                      - mapping: |
                          let api = env("GMAIL_API_URL").or("https://gmail.googleapis.com/gmail/v1")
                          let cutoff = (now().ts_unix() - (meta("since_hours").number() * 3600)).floor().string()
                          let query = ("label:" + meta("folder") + " after:" + $cutoff).escape_url_query()
                          root.url = $api + "/users/me/messages?q=" + $query + "&maxResults=" + meta("limit").string()
                          meta gmail_api = $api
                      - http:
                          url: '${! this.url }'
                          verb: GET
                          headers:
                            Authorization: "Bearer ${GMAIL_TOKEN}"
                          timeout: 30s
                          retries: 3
                          rate_limit: email_api
                      - mapping: |
                          let ids = this.messages.or([]).map_each(message -> message.id)
                          root = if $ids.length() == 0 {
                            [{"_empty": true}]
                          } else {
                            $ids.map_each(id -> {"url": meta("gmail_api") + "/users/me/messages/" + id + "?format=metadata"})
                          }
                      - unarchive:
                          format: json_array
                      - switch:
                          - check: 'this._empty.or(false)'
                            processors:
                              - mapping: 'root = this'
                          - processors:
                              - try:
                                  - http:
                                      url: '${! this.url }'
                                      verb: GET
                                      headers:
                                        Authorization: "Bearer ${GMAIL_TOKEN}"
                                      timeout: 30s
                                      retries: 3
                                      rate_limit: email_api
                                  - mapping: |
                                      let headers = this.payload.headers.or([]).fold({}, pair -> pair.tally.assign({(pair.value.name.lowercase()): pair.value.value}))
                                      root = {
                                        "id": this.id,
                                        "subject": $headers.get("subject").or(""),
                                        "from": $headers.get("from").or(""),
                                        "to": $headers.get("to").or(""),
                                        "date": $headers.get("date").or(""),
                                        "body": this.snippet.or(""),
                                        "has_attachment": this.payload.parts.or([]).any(part -> part.filename.or("").length() > 0)
                                      }
                              - catch:
                                  - mapping: 'root = {"_provider_error": error()}'
                      - archive:
                          format: json_array
                      - mapping: |
                          root = if this.any(email -> email._provider_error != null) {
                            throw(this.filter(email -> email._provider_error != null).index(0)._provider_error)
                          } else {
                            {"emails": this.filter(email -> !email._empty.or(false))}
                          }

              - check: 'meta("provider") == "outlook"'
                processors:
                  - try:
                      - mapping: |
                          let api = env("OUTLOOK_API_URL").or("https://graph.microsoft.com/v1.0")
                          let folder = meta("folder").escape_url_path()
                          let fields = "id,subject,from,toRecipients,receivedDateTime,bodyPreview,hasAttachments"
                          root.url = $api + "/me/mailFolders/" + $folder + "/messages?$top=" + meta("limit").string() + "&$select=" + $fields + "&$filter=" + ("receivedDateTime ge " + meta("since_date")).escape_url_query()
                      - http:
                          url: '${! this.url }'
                          verb: GET
                          headers:
                            Authorization: "Bearer ${OUTLOOK_TOKEN}"
                          timeout: 30s
                          retries: 3
                          rate_limit: email_api
                      - mapping: |
                          root.emails = this.value.or([]).map_each(email -> {
                            "id": email.id,
                            "subject": email.subject.or(""),
                            "from": email.from.emailAddress.address.or(""),
                            "to": email.toRecipients.or([]).map_each(recipient -> recipient.emailAddress.address),
                            "date": email.receivedDateTime,
                            "body": email.bodyPreview.or(""),
                            "has_attachment": email.hasAttachments.or(false)
                          })

              - processors:
                  - mapping: 'root = throw("provider must be gmail or outlook")'
          - mapping: |
              root = this
              root.fetch_status = "success"
              root.email_count = this.emails.length()

          - log:
              level: INFO
              message: |
                [email-triage] Fetched ${! this.email_count } emails

          # ═══════════════════════════════════════════════════════════════════════
          # STEP 3: AI Classification - categorize each email
          # ═══════════════════════════════════════════════════════════════════════
          - mapping: |
              # Prepare batch for AI classification
              let emails_text = this.emails.map_each(e -> "EMAIL ID: " + e.id + "\nFROM: " + e.from + "\nSUBJECT: " + e.subject + "\nBODY: " + e.body.slice(0, 500) + "\n---").join("\n\n")

              root.messages = [
                {
                  "role": "system",
                  "content": "You are an expert email triage assistant. Analyze emails and classify each one. For each email, determine:\n1. category: urgent, action-required, meeting, fyi, newsletter, or spam\n2. priority: 1 (highest) to 5 (lowest)\n3. action: what the recipient should do (e.g., 'respond immediately', 'schedule meeting', 'review document', 'archive', 'unsubscribe')\n4. calendar_event: if it's a meeting request, extract {title, proposed_date, proposed_time, duration_minutes}\n\nRespond with a JSON array matching the email IDs provided."
                },
                {
                  "role": "user",
                  "content": "Classify these emails:\n\n" + $emails_text + "\n\nRespond with JSON array: [{\"id\": \"...\", \"category\": \"...\", \"priority\": N, \"action\": \"...\", \"calendar_event\": null or {...}}]"
                }
              ]
              meta emails_json = this.emails.format_json()

          - openai_chat_completion:
              api_key: "${OPENAI_API_KEY}"
              model: gpt-4o-mini
              tools: []

          # ═══════════════════════════════════════════════════════════════════════
          # STEP 4: Merge AI results with email data
          # ═══════════════════════════════════════════════════════════════════════
          - mapping: |
              let ai_response = this.choices.0.message.content
              let parsed = $ai_response.parse_json().catch([])
              let classifications = if $parsed.type() == "array" { $parsed } else { [] }

              # Merge classifications with original emails
              let emails = meta("emails_json").parse_json().catch([])
              let processed_emails = $emails.map_each(email -> email.merge($classifications.filter(c -> c.id == email.id).index(0).or({"category": "fyi", "priority": 3, "action": "review", "calendar_event": null})))

              # Extract calendar events
              let calendar_events = if meta("extract_calendar_events") == "true" {
                $processed_emails.filter(e -> e.calendar_event != null).map_each(e -> e.calendar_event.merge({"email_id": e.id, "from": e.from, "subject": e.subject}))
              } else {
                []
              }

              # Count by category
              let urgent_count = $processed_emails.filter(e -> e.category == "urgent").length()
              let action_count = $processed_emails.filter(e -> e.category == "action-required").length()
              let meeting_count = $processed_emails.filter(e -> e.category == "meeting").length()

              root.summary = {
                "processed": $processed_emails.length(),
                "urgent_count": $urgent_count,
                "action_required_count": $action_count,
                "meetings_found": $meeting_count,
                "by_category": {
                  "urgent": $urgent_count,
                  "action-required": $action_count,
                  "meeting": $meeting_count,
                  "fyi": $processed_emails.filter(e -> e.category == "fyi").length(),
                  "newsletter": $processed_emails.filter(e -> e.category == "newsletter").length(),
                  "spam": $processed_emails.filter(e -> e.category == "spam").length()
                }
              }

              root.emails = $processed_emails.map_each(e -> {
                "id": e.id,
                "subject": e.subject,
                "from": e.from,
                "category": e.category,
                "priority": e.priority,
                "action": e.action,
                "calendar_event": e.calendar_event
              })

              root.calendar_events = $calendar_events

              root.metadata = {
                "skill": "email-triage",
                "mode": "cli",
                "provider": meta("provider"),
                "folder": meta("folder"),
                "trace_id": meta("trace_id").or(uuid_v4()),
                "processing_time_ms": now().ts_sub(meta("start_time")).abs() / 1000000,
                "timestamp": now()
              }

          # ═══════════════════════════════════════════════════════════════════════
          # STEP 5: Generate draft responses for action-required emails
          # ═══════════════════════════════════════════════════════════════════════
          - mapping: |
              # For urgent and action-required, suggest quick responses
              let action_emails = this.emails.filter(e -> e.category == "urgent" || e.category == "action-required")

              root = this
              root.draft_responses = $action_emails.map_each(e -> {
                "email_id": e.id,
                "subject": "RE: " + e.subject,
                "suggested_response": if e.category == "urgent" {
                  "I'm looking into this now. Will update you within the hour."
                } else {
                  "Thank you for your email. I'll review and get back to you by [deadline]."
                }
              })

          - log:
              level: INFO
              message: |
                [email-triage] Complete: ${! this.summary.processed } emails, ${! this.summary.urgent_count } urgent, ${! this.summary.meetings_found } meetings (trace: ${! meta("trace_id").slice(0, 8) })
      - catch:
          - mapping: |
              root = {"status": "error", "fetch_status": "error", "error": error()}

  output:
    stdout: {}

  rate_limit_resources:
    - label: email_api
      local:
        count: 10
        interval: 1s
    - label: openai_api
      local:
        count: 20
        interval: 60s
