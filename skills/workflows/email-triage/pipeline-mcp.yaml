# Expanso Pipeline: email-triage (MCP mode)
# ==========================================
#
# HTTP endpoint for OpenClaw/MCP integration.
#
# Usage:
#   # Start the server
#   expanso-edge validate pipeline-mcp.yaml
#
#   # Call from OpenClaw
#   "Triage my inbox and find any urgent emails"
#   → Routes to POST /triage
#
#   # Or call directly
#   curl -X POST http://localhost:8080/triage \
#     -H "Content-Type: application/json" \
#     -d '{"provider": "gmail", "limit": 50}'
#
# Validates against: docs.expanso.io/schemas/pipeline.schema.json

name: email-triage-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /triage
      allowed_verbs: [POST]
      timeout: 120s  # Email processing can take time

  pipeline:
    processors:
      # Bearer verification uses AES-GCM tag validation so token comparison is
      # constant-time inside the authenticated-cipher implementation.
      - mapping: |
          let expected = env("MCP_BEARER_TOKEN").or("")
          let authorization = meta("Authorization").or("")
          let supplied = if $authorization.has_prefix("Bearer ") { $authorization.trim_prefix("Bearer ") } else { "" }
          let nonce = "000000000000000000000000".decode("hex")
          let proof = "expanso-mcp-auth".encrypt_aes("gcm", $expected.hash("sha256"), $nonce)
          let authenticated = $proof.decrypt_aes("gcm", $supplied.hash("sha256"), $nonce).catch(null) != null
          meta http_status_code = if $expected.length() < 32 { 503 } else if $supplied == "" || !$authenticated { 401 } else { 200 }
          root = if $expected.length() < 32 {
            deleted()
          } else if $supplied == "" || !$authenticated {
            deleted()
          } else {
            this
          }

      # Initialize and validate
      - mapping: |
          meta trace_id = uuid_v4()
          meta start_time = now()

          let provider = this.provider.or("gmail")
          let folder = this.folder.or("INBOX")
          let limit = this.limit.or(50)
          let since_hours = this.since_hours.or(24)

          meta provider = $provider
          meta folder = $folder
          meta limit = $limit
          meta since_hours = $since_hours
          meta extract_calendar_events = this.extract_calendar_events.or(true)

          root = if !["gmail", "outlook"].contains($provider) {
            throw("Invalid provider. Use: gmail or outlook")
          } else {
            {"provider": $provider}
          }

      - log:
          level: INFO
          message: |
            [email-triage] MCP request: provider=${! meta("provider") } (trace: ${! meta("trace_id").slice(0, 8) })

      - switch:
          - check: 'meta("provider") == "gmail"'
            processors:
              - mapping: |
                  let api = env("GMAIL_API_URL").or("https://gmail.googleapis.com/gmail/v1")
                  let query = ("label:" + meta("folder") + " newer_than:" + meta("since_hours") + "h").escape_url_query()
                  root.url = $api + "/users/me/messages?q=" + $query + "&maxResults=" + meta("limit").string()
                  meta gmail_api = $api
              - http:
                  url: '${! this.url }'
                  verb: GET
                  headers:
                    Authorization: "Bearer ${GMAIL_TOKEN}"
                  timeout: 30s
                  retries: 3
                  rate_limit: email_api
              - mapping: |
                  let ids = this.messages.or([]).map_each(message -> message.id)
                  root = if $ids.length() == 0 { [{"_empty": true}] } else { $ids.map_each(id -> {"url": meta("gmail_api") + "/users/me/messages/" + id + "?format=metadata"}) }
              - unarchive:
                  format: json_array
              - switch:
                  - check: 'this._empty.or(false)'
                    processors:
                      - mapping: 'root = this'
                  - processors:
                      - http:
                          url: '${! this.url }'
                          verb: GET
                          headers:
                            Authorization: "Bearer ${GMAIL_TOKEN}"
                          timeout: 30s
                          retries: 3
                          rate_limit: email_api
                      - mapping: |
                          let headers = this.payload.headers.or([]).fold({}, pair -> pair.tally.assign({(pair.value.name.lowercase()): pair.value.value}))
                          root = {"id": this.id, "subject": $headers.get("subject").or(""), "from": $headers.get("from").or(""), "to": $headers.get("to").or(""), "date": $headers.get("date").or(""), "body": this.snippet.or(""), "has_attachment": this.payload.parts.or([]).any(part -> part.filename.or("").length() > 0)}
              - archive:
                  format: json_array
              - mapping: 'root.emails = this.filter(email -> !email._empty.or(false))'
          - check: 'meta("provider") == "outlook"'
            processors:
              - mapping: |
                  let api = env("OUTLOOK_API_URL").or("https://graph.microsoft.com/v1.0")
                  let fields = "id,subject,from,toRecipients,receivedDateTime,bodyPreview,hasAttachments"
                  let since_date = (now().ts_unix() - (meta("since_hours").number() * 3600)).ts_format("2006-01-02T15:04:05Z")
                  root.url = $api + "/me/mailFolders/" + meta("folder").escape_url_path() + "/messages?$top=" + meta("limit").string() + "&$select=" + $fields + "&$filter=receivedDateTime%20ge%20" + $since_date.escape_url_query()
              - http:
                  url: '${! this.url }'
                  verb: GET
                  headers:
                    Authorization: "Bearer ${OUTLOOK_TOKEN}"
                  timeout: 30s
                  retries: 3
                  rate_limit: email_api
              - mapping: |
                  root.emails = this.value.or([]).map_each(email -> {"id": email.id, "subject": email.subject.or(""), "from": email.from.emailAddress.address.or(""), "to": email.toRecipients.or([]).map_each(recipient -> recipient.emailAddress.address), "date": email.receivedDateTime, "body": email.bodyPreview.or(""), "has_attachment": email.hasAttachments.or(false)})
          - processors:
              - mapping: 'root = throw("provider must be gmail or outlook")'

      - mapping: |
          meta emails_json = this.emails.format_json()

          root.messages = [
            {
              "role": "system",
              "content": "Classify emails into: urgent, action-required, meeting, fyi, newsletter, spam. Return JSON array with id, category, priority (1-5), action."
            },
            {
              "role": "user",
              "content": "Classify: " + root.emails.format_json()
            }
          ]

      - openai_chat_completion:
          api_key: "${OPENAI_API_KEY}"
          model: gpt-4o-mini
          tools: []

      # Process results
      - mapping: |
          let parsed = this.choices.0.message.content.parse_json().catch([])
          let classifications = if $parsed.type() == "array" { $parsed } else { [] }
          let emails = meta("emails_json").parse_json().catch([])

          let processed = $emails.map_each(email -> email.merge($classifications.filter(x -> x.id == email.id).index(0).or({"category": "fyi", "priority": 3, "action": "review"})))

          let urgent = $processed.filter(e -> e.category == "urgent").length()
          let action_count = $processed.filter(e -> e.category == "action-required").length()
          let meeting_count = $processed.filter(e -> e.category == "meeting").length()
          let calendar_events = if meta("extract_calendar_events") == "true" {
            $processed.filter(e -> e.calendar_event != null).map_each(e -> e.calendar_event.merge({"email_id": e.id, "from": e.from, "subject": e.subject}))
          } else {
            []
          }
          let action_emails = $processed.filter(e -> e.category == "urgent" || e.category == "action-required")

          root.summary = {
            "processed": $processed.length(),
            "urgent_count": $urgent,
            "action_required_count": $action_count,
            "meetings_found": $meeting_count,
            "by_category": {
              "urgent": $urgent,
              "action-required": $action_count,
              "meeting": $meeting_count,
              "fyi": $processed.filter(e -> e.category == "fyi").length(),
              "newsletter": $processed.filter(e -> e.category == "newsletter").length(),
              "spam": $processed.filter(e -> e.category == "spam").length()
            }
          }
          root.emails = $processed.map_each(e -> {
            "id": e.id,
            "subject": e.subject,
            "from": e.from,
            "category": e.category,
            "priority": e.priority,
            "action": e.action,
            "calendar_event": e.calendar_event.or(null)
          })
          root.calendar_events = $calendar_events
          root.draft_responses = $action_emails.map_each(e -> {
            "email_id": e.id,
            "subject": "RE: " + e.subject,
            "suggested_response": if e.category == "urgent" {
              "I'm looking into this now. Will update you within the hour."
            } else {
              "Thank you for your email. I'll review and get back to you by [deadline]."
            }
          })
          root.metadata = {
            "skill": "email-triage",
            "mode": "mcp",
            "provider": meta("provider"),
            "trace_id": meta("trace_id").or(uuid_v4()),
            "processing_time_ms": now().ts_sub(meta("start_time")).abs() / 1000000,
            "timestamp": now()
          }

      - log:
          level: INFO
          message: |
            [email-triage] MCP complete: ${! this.summary.processed } emails (trace: ${! meta("trace_id").slice(0, 8) })

  output:
    sync_response: {}

  rate_limit_resources:
    - label: email_api
      local:
        count: 10
        interval: 1s

selector:
  match_labels:
    capability: llm
    integration: email
