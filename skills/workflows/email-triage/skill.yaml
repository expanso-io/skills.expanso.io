# Skill: email-triage
# Version: 1.0.0
#
# Intelligent email triage: fetch, categorize, prioritize, and draft responses.
# Inspired by the user who cleared 6,000 emails on day one.
#
# Features:
# - Categorize emails (urgent, action-required, FYI, spam)
# - Extract proposed calendar events
# - Draft response suggestions
#
# Security: credentials are read from the executing node's environment and are
# not sent to Expanso Cloud. Mail credentials go only to their mail provider;
# normalized email content is sent to the configured AI provider.

name: email-triage
version: 1.0.0
description: AI-powered Gmail and Microsoft 365 triage with response drafting

# Credentials (read from the executing node's environment; each sent to its
# provider)
credentials:
  - name: GMAIL_TOKEN
    required: false
    description: Gmail OAuth access token
  - name: OUTLOOK_TOKEN
    required: false
    description: Microsoft Graph API token
  - name: OPENAI_API_KEY
    required: true
    description: OpenAI API key for AI processing
  - name: MCP_BEARER_TOKEN
    required: false
    description: Required caller bearer token for the MCP endpoint (32+ characters)

# Skill inputs
inputs:
  - name: provider
    type: string
    required: true
    enum: [gmail, outlook]
    description: Email provider to connect
  - name: folder
    type: string
    default: INBOX
    description: Email folder to process
  - name: limit
    type: integer
    default: 50
    description: Maximum emails to process per run
  - name: since_hours
    type: integer
    default: 24
    description: Process emails from last N hours
  - name: extract_calendar_events
    type: boolean
    default: true
    description: Extract proposed calendar events from meeting requests

# Skill outputs
outputs:
  - name: summary
    type: object
    description: "Triage summary: {processed, by_category, urgent_count, meetings_found}"
  - name: emails
    type: array
    description: "Processed emails with: {id, subject, from, category, priority, action, calendar_event?}"
  - name: calendar_events
    type: array
    description: Proposed calendar events extracted from messages; no event is created
  - name: draft_responses
    type: array
    description: Suggested responses for action-required emails
  - name: metadata
    type: object
    description: Processing metadata and audit trail

# Backend options
backends:
  - name: gmail
    type: remote
    requires: [GMAIL_TOKEN]
    description: Gmail REST API over HTTPS
  - name: microsoft-graph
    type: remote
    requires: [OUTLOOK_TOKEN]
    description: Microsoft Graph mail API over HTTPS
  - name: openai
    type: remote
    requires: [OPENAI_API_KEY]
    description: OpenAI GPT-4o-mini for classification and drafting
# Expanso components used
components:
  inputs:
    - stdin
    - http_server
  processors:
    - mapping
    - openai_chat_completion
    - switch
    - http
    - log
  outputs:
    - stdout
    - sync_response

# Rate limiting
rate_limits:
  - label: email_api
    count: 10
    interval: 1s
  - label: openai_api
    count: 20
    interval: 1m
