# Example: Email triage with proposed calendar events
#
# Process emails and extract meeting proposals for review. This does not create
# calendar events.

input:
  provider: outlook
  folder: INBOX
  limit: 100
  since_hours: 48
  extract_calendar_events: true

# Required environment variables:
# - OUTLOOK_TOKEN: Microsoft Graph API token
# - OPENAI_API_KEY: For AI classification
