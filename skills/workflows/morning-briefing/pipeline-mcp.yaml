# Expanso Pipeline: morning-briefing (MCP mode)

name: morning-briefing-mcp
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /briefing
      allowed_verbs: [POST]
      timeout: 60s

  pipeline:
    processors:
      - mapping: |
          meta trace_id = uuid_v4()
          let data = {
            "calendar": this.calendar.or([]),
            "weather": this.weather.or({}),
            "news": this.news.or([]),
            "tasks": this.tasks.or([])
          }
          let priorities = $data.tasks.filter(task -> task.priority.or(99) <= 2).map_each(task -> task.title.or("Untitled task"))

          meta location = this.location.or($data.weather.location).or("")
          meta briefing_json = $data.format_json()
          meta priorities_json = $priorities.format_json()

          root.messages = [
            {
              "role": "system",
              "content": "Create a concise morning briefing using only the supplied records. Do not invent meetings, weather, headlines, tasks, or delivery receipts."
            },
            {
              "role": "user",
              "content": "Briefing records:\n" + $data.format_json()
            }
          ]

      - openai_chat_completion:
          api_key: "${OPENAI_API_KEY}"
          model: gpt-4o-mini
          tools: []

      - mapping: |
          root.briefing = meta("briefing_json").parse_json()
          root.summary = this.choices.0.message.content
          root.priorities = meta("priorities_json").parse_json()
          root.metadata = {
            "skill": "morning-briefing",
            "mode": "mcp",
            "source": "request",
            "location": meta("location"),
            "trace_id": meta("trace_id").or(uuid_v4()),
            "timestamp": now()
          }

  output:
    sync_response: {}
