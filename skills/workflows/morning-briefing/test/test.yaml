tests:
  - name: "Summarizes only supplied briefing records"
    input: '{"location":"New York, NY","calendar":[{"time":"09:00","title":"Standup"}],"weather":{"location":"New York, NY","temperature":61,"condition":"Rain"},"news":[{"title":"Transit update","source":"City desk"}],"tasks":[{"title":"Review roadmap","priority":1}]}'
    expected_output:
      briefing:
        calendar:
          - time: "09:00"
            title: Standup
        weather:
          location: "New York, NY"
          temperature: 61
          condition: Rain
      priorities:
        - Review roadmap
