# Skill: stripe-reports
# Version: 1.0.0
#
# Generate revenue reports from Stripe balance transactions.
#
# Features:
# - Fetch balance transactions using Stripe API v1
# - Calculate gross, net, fee, and refund totals
# - Optionally generate AI insights from those calculated metrics
#
# Security: the Stripe API key is read from the executing node's environment and
# sent to the Stripe API as its credential. It is not sent to Expanso Cloud.

name: stripe-reports
version: 1.0.0
description: Generate revenue reports from authenticated Stripe balance transactions

credentials:
  - name: STRIPE_API_KEY
    required: true
    description: Stripe secret API key (sk_live_... or sk_test_...)
  - name: OPENAI_API_KEY
    required: true
    description: OpenAI API key for AI insights

inputs:
  - name: period
    type: string
    default: today
    enum: [today, yesterday, week, month, quarter]
    description: Reporting period
  - name: include_insights
    type: boolean
    default: false
    description: Generate AI insights
  - name: include_quick_wins
    type: boolean
    default: true
    description: Include quick-win actions when AI insights are enabled

outputs:
  - name: report
    type: object
    description: Report period, Unix time range, and generation timestamp
  - name: metrics
    type: object
    description: Calculated revenue and balance-transaction counts
  - name: insights
    type: array
    description: AI-generated insights and observations
  - name: quick_wins
    type: array
    description: AI-generated actions based only on the calculated Stripe metrics
  - name: metadata
    type: object
    description: Report metadata and audit trail

backends:
  - name: stripe
    type: remote
    requires: [STRIPE_API_KEY]
    description: Stripe API v1 over HTTPS
  - name: openai
    type: remote
    requires: [OPENAI_API_KEY]
    description: OpenAI for insights generation
  - name: fixture
    type: local
    requires: []
    description: Explicit deterministic Stripe transaction fixtures for CI

components:
  inputs: [stdin, http_server]
  processors: [mapping, http, openai_chat_completion, switch]
  outputs: [stdout, sync_response]

rate_limits:
  - label: stripe_api
    count: 25
    interval: 1s
