# Skill: seo-pipeline
# Version: 1.0.0
#
# Fetch and inspect a page's rendered source for on-page SEO signals.

name: seo-pipeline
version: 1.0.0
description: Inspect a public HTTPS page for title, description, headings, links, and image alt text

inputs:
  - name: action
    type: string
    default: analyze
    enum: [analyze]
  - name: url
    type: string
    required: false
  - name: keywords
    type: array
    default: []
  - name: html
    type: string
    required: false
    description: Optional caller-supplied HTML; when omitted the pipeline fetches url

outputs:
  - name: analysis
    type: object
  - name: recommendations
    type: array
  - name: metadata
    type: object

backends:
  - name: local
    type: local

components:
  inputs: [stdin, http_server]
  processors: [mapping, http, switch, log]
  outputs: [stdout, sync_response]
