# Skill: todoist-automate
# Version: 1.0.0
#
# List, create, update, and complete Todoist tasks through API v1.

name: todoist-automate
version: 1.0.0
description: Manage Todoist tasks through authenticated Todoist API v1 requests

credentials:
  - name: TODOIST_TOKEN
    required: true
    description: Todoist API token

inputs:
  - name: action
    type: string
    default: list
    enum: [list, create, update, complete]
  - name: project_id
    type: string
    required: false
  - name: task_id
    type: string
    required: false
  - name: content
    type: string
    required: false
  - name: description
    type: string
    required: false
  - name: due_date
    type: string
    required: false
  - name: priority
    type: integer
    required: false

outputs:
  - name: tasks
    type: array
  - name: result
    type: object
  - name: metadata
    type: object

backends:
  - name: todoist
    type: remote
    requires: [TODOIST_TOKEN]
    description: Todoist API v1 over HTTPS
  - name: fixture
    type: local
    requires: []
    description: Explicit deterministic task fixtures for CI

components:
  inputs: [stdin, http_server]
  processors: [mapping, http, switch]
  outputs: [stdout, sync_response]
