# Expanso Pipeline: todoist-automate (CLI mode)
#
# Uses the current Todoist API v1 over HTTPS with Bearer authentication.

name: todoist-automate-cli
type: pipeline

config:
  input:
    stdin:
      codec: lines

  pipeline:
    processors:
      - mapping: |
          let input = content().parse_json()
          root = $input
          root.action = $input.action.or("list").string()
          root._trace_id = uuid_v4()

      - switch:
          - check: 'this.fixture_mode.or(false)'
            processors:
              - mapping: |
                  let tasks = this.fixture_tasks.or([])
                  let today = now().ts_format("2006-01-02")
                  root.action = this.action
                  root.tasks = $tasks
                  root.result = this.fixture_result.or({"tasks": $tasks})
                  root.summary = {
                    "total": $tasks.length(),
                    "high_priority": $tasks.filter(task -> task.priority.or(1) >= 3).length(),
                    "due_today": $tasks.filter(task -> task.due.date.or("") == $today).length()
                  }
                  root.metadata = {
                    "skill": "todoist-automate",
                    "mode": "cli",
                    "action": this.action,
                    "fixture": true,
                    "trace_id": this._trace_id,
                    "timestamp": now()
                  }

          - check: 'this.action == "list"'
            processors:
              - mapping: |
                  let base = env("TODOIST_API_URL").or("https://api.todoist.com/api/v1").trim_suffix("/")
                  meta action = this.action
                  meta trace_id = this._trace_id
                  meta url = $base + "/tasks?limit=" + this.limit.or(50).string()
                  root = if !$base.re_match("^https://") { throw("TODOIST_API_URL must be an https URL") } else { {} }
              - http:
                  url: '${! meta("url") }'
                  verb: GET
                  headers:
                    Authorization: "Bearer ${TODOIST_TOKEN}"
                    Accept: application/json
                  timeout: 30s
                  retries: 3
                  rate_limit: todoist_api
              - mapping: |
                  let tasks = if this.type() == "array" { this } else { this.results.or([]) }
                  let today = now().ts_format("2006-01-02")
                  root.action = meta("action")
                  root.tasks = $tasks
                  root.result = {"tasks": $tasks, "next_cursor": this.next_cursor.or(null)}
                  root.summary = {
                    "total": $tasks.length(),
                    "high_priority": $tasks.filter(task -> task.priority.or(1) >= 3).length(),
                    "due_today": $tasks.filter(task -> task.due.date.or("") == $today).length()
                  }
                  root.metadata = {
                    "skill": "todoist-automate",
                    "mode": "cli",
                    "action": meta("action"),
                    "fixture": false,
                    "trace_id": meta("trace_id").or(uuid_v4()),
                    "timestamp": now()
                  }

          - check: 'this.action == "create"'
            processors:
              - mapping: |
                  let base = env("TODOIST_API_URL").or("https://api.todoist.com/api/v1").trim_suffix("/")
                  meta action = this.action
                  meta trace_id = this._trace_id
                  meta url = $base + "/tasks"
                  root = if !$base.re_match("^https://") {
                    throw("TODOIST_API_URL must be an https URL")
                  } else if this.content.or("").length() == 0 {
                    throw("content is required for create")
                  } else {
                    {
                      "content": this.content,
                      "description": this.description.or(""),
                      "project_id": this.project_id.or(null),
                      "due_date": this.due_date.or(null),
                      "priority": this.priority.or(1)
                    }
                  }
              - http:
                  url: '${! meta("url") }'
                  verb: POST
                  headers:
                    Authorization: "Bearer ${TODOIST_TOKEN}"
                    Accept: application/json
                    Content-Type: application/json
                  timeout: 30s
                  retries: 3
                  rate_limit: todoist_api
              - mapping: |
                  root.action = meta("action")
                  root.tasks = [this]
                  root.result = {"task": this}
                  root.metadata = {
                    "skill": "todoist-automate",
                    "mode": "cli",
                    "action": meta("action"),
                    "fixture": false,
                    "trace_id": meta("trace_id").or(uuid_v4()),
                    "timestamp": now()
                  }

          - check: 'this.action == "update"'
            processors:
              - mapping: |
                  let base = env("TODOIST_API_URL").or("https://api.todoist.com/api/v1").trim_suffix("/")
                  meta action = this.action
                  meta trace_id = this._trace_id
                  meta url = $base + "/tasks/" + this.task_id.or("").escape_url_path()
                  root = if !$base.re_match("^https://") {
                    throw("TODOIST_API_URL must be an https URL")
                  } else if this.task_id.or("").length() == 0 {
                    throw("task_id is required for update")
                  } else {
                    {
                      "content": this.content.or(null),
                      "description": this.description.or(null),
                      "due_date": this.due_date.or(null),
                      "priority": this.priority.or(null)
                    }
                  }
              - http:
                  url: '${! meta("url") }'
                  verb: POST
                  headers:
                    Authorization: "Bearer ${TODOIST_TOKEN}"
                    Accept: application/json
                    Content-Type: application/json
                  timeout: 30s
                  retries: 3
                  rate_limit: todoist_api
              - mapping: |
                  root.action = meta("action")
                  root.tasks = [this]
                  root.result = {"task": this}
                  root.metadata = {
                    "skill": "todoist-automate",
                    "mode": "cli",
                    "action": meta("action"),
                    "fixture": false,
                    "trace_id": meta("trace_id").or(uuid_v4()),
                    "timestamp": now()
                  }

          - check: 'this.action == "complete"'
            processors:
              - mapping: |
                  let base = env("TODOIST_API_URL").or("https://api.todoist.com/api/v1").trim_suffix("/")
                  meta action = this.action
                  meta task_id = this.task_id.or("")
                  meta trace_id = this._trace_id
                  meta url = $base + "/tasks/" + this.task_id.or("").escape_url_path() + "/close"
                  root = if !$base.re_match("^https://") {
                    throw("TODOIST_API_URL must be an https URL")
                  } else if this.task_id.or("").length() == 0 {
                    throw("task_id is required for complete")
                  } else {
                    {}
                  }
              - http:
                  url: '${! meta("url") }'
                  verb: POST
                  headers:
                    Authorization: "Bearer ${TODOIST_TOKEN}"
                    Accept: application/json
                  timeout: 30s
                  retries: 3
                  rate_limit: todoist_api
              - mapping: |
                  root.action = meta("action")
                  root.tasks = []
                  root.result = {"task_id": meta("task_id"), "completed": true}
                  root.metadata = {
                    "skill": "todoist-automate",
                    "mode": "cli",
                    "action": meta("action"),
                    "fixture": false,
                    "trace_id": meta("trace_id").or(uuid_v4()),
                    "timestamp": now()
                  }

          - processors:
              - mapping: |
                  root.status = "unsupported"
                  root.action = this.action
                  root.tasks = []
                  root.capability_gap = {
                    "supported_actions": ["list", "create", "update", "complete"],
                    "requested_action": this.action
                  }
                  root.metadata = {
                    "skill": "todoist-automate",
                    "mode": "cli",
                    "action": this.action,
                    "trace_id": this._trace_id,
                    "timestamp": now()
                  }

  output:
    stdout: {}

  rate_limit_resources:
    - label: todoist_api
      local:
        count: 5
        interval: 1s
