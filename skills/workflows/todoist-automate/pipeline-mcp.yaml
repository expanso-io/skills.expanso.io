# Expanso Pipeline: todoist-automate (MCP mode)

name: todoist-automate-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /todoist
      allowed_verbs: [POST]
      timeout: 60s

  pipeline:
    processors:
      # Bearer verification uses AES-GCM tag validation so token comparison is
      # constant-time inside the authenticated-cipher implementation.
      - mapping: |
          let expected = env("MCP_BEARER_TOKEN").or("")
          let authorization = meta("Authorization").or("")
          let supplied = if $authorization.has_prefix("Bearer ") { $authorization.trim_prefix("Bearer ") } else { "" }
          let nonce = "000000000000000000000000".decode("hex")
          let proof = "expanso-mcp-auth".encrypt_aes("gcm", $expected.hash("sha256"), $nonce)
          let authenticated = $proof.decrypt_aes("gcm", $supplied.hash("sha256"), $nonce).catch(null) != null
          meta http_status_code = if $supplied == "" || !$authenticated { 401 } else { 200 }
          root = if $expected.length() < 32 {
            throw("MCP_BEARER_TOKEN must contain at least 32 characters")
          } else if $supplied == "" || !$authenticated {
            deleted()
          } else {
            this
          }

      - mapping: |
          root = this
          root.action = this.action.or("list").string()
          root._trace_id = uuid_v4()

      - switch:
          - check: 'this.action == "list"'
            processors:
              - mapping: |
                  let base = env("TODOIST_API_URL").or("https://api.todoist.com/api/v1").trim_suffix("/")
                  meta action = this.action
                  meta trace_id = this._trace_id
                  meta url = $base + "/tasks?limit=" + this.limit.or(50).string()
                  root = if !$base.re_match("^https://") { throw("TODOIST_API_URL must be an https URL") } else { {} }
              - http:
                  url: '${! meta("url") }'
                  verb: GET
                  headers:
                    Authorization: "Bearer ${TODOIST_TOKEN}"
                    Accept: application/json
                  timeout: 30s
                  retries: 3
                  rate_limit: todoist_api
              - mapping: |
                  let tasks = if this.type() == "array" { this } else { this.results.or([]) }
                  let today = now().ts_format("2006-01-02")
                  root.action = meta("action")
                  root.tasks = $tasks
                  root.result = {"tasks": $tasks, "next_cursor": this.next_cursor.or(null)}
                  root.summary = {
                    "total": $tasks.length(),
                    "high_priority": $tasks.filter(task -> task.priority.or(1) >= 3).length(),
                    "due_today": $tasks.filter(task -> task.due.date.or("") == $today).length()
                  }
                  root.metadata = {
                    "skill": "todoist-automate",
                    "mode": "mcp",
                    "action": meta("action"),
                    "source": "todoist_api",
                    "trace_id": meta("trace_id").or(uuid_v4()),
                    "timestamp": now()
                  }

          - check: 'this.action == "create"'
            processors:
              - mapping: |
                  let base = env("TODOIST_API_URL").or("https://api.todoist.com/api/v1").trim_suffix("/")
                  meta action = this.action
                  meta trace_id = this._trace_id
                  meta url = $base + "/tasks"
                  root = if !$base.re_match("^https://") {
                    throw("TODOIST_API_URL must be an https URL")
                  } else if this.content.or("").length() == 0 {
                    throw("content is required for create")
                  } else {
                    {
                      "content": this.content,
                      "description": this.description.or(""),
                      "project_id": this.project_id.or(null),
                      "due_date": this.due_date.or(null),
                      "priority": this.priority.or(1)
                    }
                  }
              - http:
                  url: '${! meta("url") }'
                  verb: POST
                  headers:
                    Authorization: "Bearer ${TODOIST_TOKEN}"
                    Accept: application/json
                    Content-Type: application/json
                  timeout: 30s
                  retries: 3
                  rate_limit: todoist_api
              - mapping: |
                  root.action = meta("action")
                  root.tasks = [this]
                  root.result = {"task": this}
                  root.metadata = {
                    "skill": "todoist-automate",
                    "mode": "mcp",
                    "action": meta("action"),
                    "source": "todoist_api",
                    "trace_id": meta("trace_id").or(uuid_v4()),
                    "timestamp": now()
                  }

          - check: 'this.action == "update"'
            processors:
              - mapping: |
                  let base = env("TODOIST_API_URL").or("https://api.todoist.com/api/v1").trim_suffix("/")
                  meta action = this.action
                  meta trace_id = this._trace_id
                  meta url = $base + "/tasks/" + this.task_id.or("").escape_url_path()
                  root = if !$base.re_match("^https://") {
                    throw("TODOIST_API_URL must be an https URL")
                  } else if this.task_id.or("").length() == 0 {
                    throw("task_id is required for update")
                  } else {
                    {
                      "content": this.content.or(null),
                      "description": this.description.or(null),
                      "due_date": this.due_date.or(null),
                      "priority": this.priority.or(null)
                    }
                  }
              - http:
                  url: '${! meta("url") }'
                  verb: POST
                  headers:
                    Authorization: "Bearer ${TODOIST_TOKEN}"
                    Accept: application/json
                    Content-Type: application/json
                  timeout: 30s
                  retries: 3
                  rate_limit: todoist_api
              - mapping: |
                  root.action = meta("action")
                  root.tasks = [this]
                  root.result = {"task": this}
                  root.metadata = {
                    "skill": "todoist-automate",
                    "mode": "mcp",
                    "action": meta("action"),
                    "source": "todoist_api",
                    "trace_id": meta("trace_id").or(uuid_v4()),
                    "timestamp": now()
                  }

          - check: 'this.action == "complete"'
            processors:
              - mapping: |
                  let base = env("TODOIST_API_URL").or("https://api.todoist.com/api/v1").trim_suffix("/")
                  meta action = this.action
                  meta task_id = this.task_id.or("")
                  meta trace_id = this._trace_id
                  meta url = $base + "/tasks/" + this.task_id.or("").escape_url_path() + "/close"
                  root = if !$base.re_match("^https://") {
                    throw("TODOIST_API_URL must be an https URL")
                  } else if this.task_id.or("").length() == 0 {
                    throw("task_id is required for complete")
                  } else {
                    {}
                  }
              - http:
                  url: '${! meta("url") }'
                  verb: POST
                  headers:
                    Authorization: "Bearer ${TODOIST_TOKEN}"
                    Accept: application/json
                  timeout: 30s
                  retries: 3
                  rate_limit: todoist_api
              - mapping: |
                  root.action = meta("action")
                  root.tasks = []
                  root.result = {"task_id": meta("task_id"), "completed": true}
                  root.metadata = {
                    "skill": "todoist-automate",
                    "mode": "mcp",
                    "action": meta("action"),
                    "source": "todoist_api",
                    "trace_id": meta("trace_id").or(uuid_v4()),
                    "timestamp": now()
                  }

          - processors:
              - mapping: |
                  root.status = "unsupported"
                  root.action = this.action
                  root.tasks = []
                  root.capability_gap = {
                    "supported_actions": ["list", "create", "update", "complete"],
                    "requested_action": this.action
                  }
                  root.metadata = {
                    "skill": "todoist-automate",
                    "mode": "mcp",
                    "action": this.action,
                    "trace_id": this._trace_id,
                    "timestamp": now()
                  }

  output:
    sync_response: {}

  rate_limit_resources:
    - label: todoist_api
      local:
        count: 5
        interval: 1s
