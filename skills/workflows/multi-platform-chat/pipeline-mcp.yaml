# Expanso Pipeline: multi-platform-chat (MCP mode)

name: multi-platform-chat-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /chat
      allowed_verbs: [POST]
      timeout: 60s

  pipeline:
    processors:
      - mapping: |
          root = {"status": "unsupported", "publication": "pulled", "skill": "multi-platform-chat", "reason": "Claims message delivery without sending responses to the named messaging platforms."}

  output:
    sync_response: {}
