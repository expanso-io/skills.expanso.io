# Expanso Pipeline: jira-automate (MCP mode)

name: jira-automate-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /jira
      allowed_verbs: [POST]
      timeout: 60s

  pipeline:
    processors:
      # Bearer verification uses AES-GCM tag validation so token comparison is
      # constant-time inside the authenticated-cipher implementation.
      - mapping: |
          let expected = env("MCP_BEARER_TOKEN").or("")
          let authorization = meta("Authorization").or("")
          let supplied = if $authorization.has_prefix("Bearer ") { $authorization.trim_prefix("Bearer ") } else { "" }
          let nonce = "000000000000000000000000".decode("hex")
          let proof = "expanso-mcp-auth".encrypt_aes("gcm", $expected.hash("sha256"), $nonce)
          let authenticated = $proof.decrypt_aes("gcm", $supplied.hash("sha256"), $nonce).catch(null) != null
          meta http_status_code = if $expected.length() < 32 { 503 } else if $supplied == "" || !$authenticated { 401 } else { 200 }
          root = if $expected.length() < 32 {
            deleted()
          } else if $supplied == "" || !$authenticated {
            deleted()
          } else {
            this
          }

      - mapping: |
          root = this
          root.action = this.action.or("search").string()
          root.project = this.project.or("").string()
          root._trace_id = uuid_v4()

      - switch:
          - check: 'this.action == "search"'
            processors:
              - try:
                  - mapping: |
                      let base = env("JIRA_URL").trim_suffix("/")
                      meta trace_id = this._trace_id
                      meta jira_auth = "Basic " + (env("JIRA_EMAIL").or("") + ":" + env("JIRA_API_TOKEN").or("")).encode("base64")
                      meta jira_action = this.action
                      meta jira_url = $base + "/rest/api/3/search/jql"
                      root = if !$base.re_match("^https://") {
                        throw("JIRA_URL must be an https URL")
                      } else if this.project.length() == 0 {
                        throw("project is required for search")
                      } else {
                        {
                          "jql": "project = " + this.project,
                          "fields": ["key", "summary", "status", "assignee"],
                          "maxResults": this.limit.or(50)
                        }
                      }
                  - http:
                      url: '${! meta("jira_url") }'
                      verb: POST
                      headers:
                        Authorization: '${! meta("jira_auth") }'
                        Accept: application/json
                        Content-Type: application/json
                      timeout: 30s
                      retries: 3
                      rate_limit: jira_api
                  - mapping: |
                      let issues = this.issues.or([]).map_each(issue -> {
                        "key": issue.key,
                        "summary": issue.fields.summary.or(""),
                        "status": issue.fields.status.name.or(""),
                        "assignee": issue.fields.assignee.emailAddress.or(issue.fields.assignee.displayName).or(null)
                      })
                      root.action = meta("jira_action")
                      root.result = {"issues": $issues, "next_page_token": this.nextPageToken.or(null)}
                      root.issues = $issues
                      root.metadata = {
                        "skill": "jira-automate",
                        "mode": "mcp",
                        "action": meta("jira_action"),
                        "source": "jira_api",
                        "trace_id": meta("trace_id").or(uuid_v4()),
                        "timestamp": now()
                      }
              - catch:
                  - mapping: |
                      root = {"status": "error", "error": error()}

          - check: 'this.action == "create"'
            processors:
              - try:
                  - mapping: |
                      let base = env("JIRA_URL").trim_suffix("/")
                      meta trace_id = this._trace_id
                      meta jira_auth = "Basic " + (env("JIRA_EMAIL").or("") + ":" + env("JIRA_API_TOKEN").or("")).encode("base64")
                      meta jira_action = this.action
                      meta jira_url = $base + "/rest/api/3/issue"
                      root = if !$base.re_match("^https://") {
                        throw("JIRA_URL must be an https URL")
                      } else if this.project.length() == 0 || this.summary.or("").length() == 0 {
                        throw("project and summary are required for create")
                      } else {
                        {
                          "fields": {
                            "project": {"key": this.project},
                            "summary": this.summary,
                            "description": {
                              "type": "doc",
                              "version": 1,
                              "content": [{
                                "type": "paragraph",
                                "content": [{"type": "text", "text": this.description.or("")}]
                              }]
                            },
                            "issuetype": {"name": this.issue_type.or("Task")}
                          }
                        }
                      }
                  - http:
                      url: '${! meta("jira_url") }'
                      verb: POST
                      headers:
                        Authorization: '${! meta("jira_auth") }'
                        Accept: application/json
                        Content-Type: application/json
                      timeout: 30s
                      # Creating an issue is not idempotent. Do not replay a
                      # request after an ambiguous transport failure.
                      retries: 0
                      rate_limit: jira_api
                  - mapping: |
                      root.action = meta("jira_action")
                      root.result = {"issue": {"id": this.id, "key": this.key, "self": this.self}}
                      root.issues = [root.result.issue]
                      root.metadata = {
                        "skill": "jira-automate",
                        "mode": "mcp",
                        "action": meta("jira_action"),
                        "source": "jira_api",
                        "trace_id": meta("trace_id").or(uuid_v4()),
                        "timestamp": now()
                      }
              - catch:
                  - mapping: |
                      root = {"status": "error", "error": error()}

          - check: 'this.action == "update"'
            processors:
              - try:
                  - mapping: |
                      let base = env("JIRA_URL").trim_suffix("/")
                      meta trace_id = this._trace_id
                      meta jira_auth = "Basic " + (env("JIRA_EMAIL").or("") + ":" + env("JIRA_API_TOKEN").or("")).encode("base64")
                      meta jira_action = this.action
                      meta issue_key = this.issue_key
                      meta jira_url = $base + "/rest/api/3/issue/" + this.issue_key.or("").escape_url_path()
                      root = if !$base.re_match("^https://") {
                        throw("JIRA_URL must be an https URL")
                      } else if this.issue_key.or("").length() == 0 || this.summary.or("").length() == 0 {
                        throw("issue_key and summary are required for update")
                      } else {
                        {"fields": {"summary": this.summary}}
                      }
                  - http:
                      url: '${! meta("jira_url") }'
                      verb: PUT
                      headers:
                        Authorization: '${! meta("jira_auth") }'
                        Accept: application/json
                        Content-Type: application/json
                      timeout: 30s
                      retries: 3
                      rate_limit: jira_api
                  - mapping: |
                      root.action = meta("jira_action")
                      root.result = {"issue": {"key": meta("issue_key"), "updated": true}}
                      root.issues = [root.result.issue]
                      root.metadata = {
                        "skill": "jira-automate",
                        "mode": "mcp",
                        "action": meta("jira_action"),
                        "source": "jira_api",
                        "trace_id": meta("trace_id").or(uuid_v4()),
                        "timestamp": now()
                      }
              - catch:
                  - mapping: |
                      root = {"status": "error", "action": meta("jira_action"), "error": error()}

          - processors:
              - mapping: |
                  root.status = "unsupported"
                  root.action = this.action
                  root.issues = []
                  root.capability_gap = {
                    "supported_actions": ["search", "create", "update"],
                    "requested_action": this.action
                  }
                  root.metadata = {
                    "skill": "jira-automate",
                    "mode": "mcp",
                    "action": this.action,
                    "trace_id": this._trace_id,
                    "timestamp": now()
                  }

  output:
    sync_response: {}

  rate_limit_resources:
    - label: jira_api
      local:
        count: 5
        interval: 1s
