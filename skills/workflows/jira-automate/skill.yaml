# Skill: jira-automate
# Version: 1.0.0
#
# Search, create, and update Jira Cloud issues through REST API v3.

name: jira-automate
version: 1.0.0
description: Search, create, and update Jira Cloud issues with authenticated REST API v3 requests

credentials:
  - name: JIRA_URL
    required: true
    description: Jira instance URL (e.g., https://company.atlassian.net)
  - name: JIRA_EMAIL
    required: true
    description: Jira account email
  - name: JIRA_API_TOKEN
    required: true
    description: Jira API token
  - name: MCP_BEARER_TOKEN
    required: false
    description: Required caller bearer token for the MCP endpoint (32+ characters)

inputs:
  - name: action
    type: string
    required: true
    enum: [create, update, search]
    description: Action to perform
  - name: project
    type: string
    required: false
    description: Jira project key
  - name: issue_key
    type: string
    required: false
    description: Issue key (e.g., PROJ-123)
  - name: summary
    type: string
    required: false
    description: Issue summary for create/update
  - name: description
    type: string
    required: false
    description: Issue description
  - name: issue_type
    type: string
    default: Task
    description: Issue type (Task, Bug, Story, Epic)

outputs:
  - name: result
    type: object
    description: Action result
  - name: issues
    type: array
    description: Affected issues
  - name: metadata
    type: object
    description: Execution metadata

backends:
  - name: jira-cloud
    type: remote
    requires: [JIRA_URL, JIRA_EMAIL, JIRA_API_TOKEN]
    description: Jira Cloud REST API v3 over HTTPS

components:
  inputs: [stdin, http_server]
  processors: [mapping, http, switch]
  outputs: [stdout, sync_response]
