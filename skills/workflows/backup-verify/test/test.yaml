# Test: backup-verify
tests:
  - name: "Verifies backups"
    input: '{"cloud_provider":"s3","bucket":"my-backup","local_manifest":[{"path":"a.txt","size":3,"sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"},{"path":"b.txt","size":4,"sha256":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}],"backup_manifest":[{"path":"a.txt","size":3,"sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"},{"path":"b.txt","size":5,"sha256":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"}]}'
    expected_output:
      status:
        verified: false
        local_files: 2
        backup_files: 2
        differences: 1
