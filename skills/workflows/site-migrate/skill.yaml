# Skill: site-migrate
name: site-migrate
version: 1.0.0
description: Check whether a requested website migration is implemented by this Edge recipe

inputs:
  - name: source
    type: string
    required: true
    enum: [notion, wordpress, ghost, markdown]
  - name: destination
    type: string
    required: true
    enum: [astro, hugo, nextjs, static]
  - name: source_url
    type: string
    required: false

outputs:
  - name: pages_migrated
    type: integer
  - name: assets_migrated
    type: integer
  - name: errors
    type: array
  - name: deploy_url
    type: string
  - name: status
    type: string
  - name: capability_gap
    type: object
  - name: metadata
    type: object

backends:
  - name: local
    type: local

components:
  inputs: [stdin, http_server]
  processors: [mapping, log]
  outputs: [stdout, sync_response]

publication:
  status: pulled
  reason: Named source connectors, asset migration, site build, and deployment are not implemented.
