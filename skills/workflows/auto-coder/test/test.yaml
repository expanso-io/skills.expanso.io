# The example must report its capability gap instead of inventing edits or a PR.
tests:
  - name: "Reports missing repository execution capabilities"
    input: '{"task":"Add error handling","repo":"org/repo"}'
    expected_output:
      status: unsupported
      repo: org/repo
      changes: []
      ci_status: not_run
      capability_gap:
        requested: "modify a repository, run its tests, and create a pull request"
