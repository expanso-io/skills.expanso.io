# Skill: auto-coder
# Version: 1.0.0
#
# Capability check for autonomous repository coding.

name: auto-coder
version: 1.0.0
description: Report the execution capabilities required before an autonomous coding request can run

inputs:
  - name: task
    type: string
    required: true
    description: Coding task to accomplish
  - name: repo
    type: string
    required: true
  - name: branch
    type: string
    default: auto-coder
  - name: create_pr
    type: boolean
    default: true

outputs:
  - name: status
    type: string
    description: Always unsupported until repository execution is configured
  - name: changes
    type: array
    description: Empty because this pipeline does not edit repositories
  - name: pr_url
    type: string
    description: Null because this pipeline does not create pull requests
  - name: tests_passed
    type: object
    description: Null because tests are not run
  - name: capability_gap
    type: object
    description: Exact missing capabilities and supporting evidence
  - name: metadata
    type: object

backends:
  - name: local
    type: local
    requires: []
    description: Deterministic local capability check

components:
  inputs: [stdin, http_server]
  processors: [mapping, log]
  outputs: [stdout, sync_response]

publication:
  status: pulled
  reason: Repository checkout, code execution, tests, and pull-request creation are not implemented.
