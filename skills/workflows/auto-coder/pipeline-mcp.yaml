# Expanso Pipeline: auto-coder capability check (MCP mode)

name: auto-coder-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /code
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let trace_id = uuid_v4()
          let task = this.task.or("").string()
          let repo = this.repo.or("").string()

          root = if $task.length() == 0 || $repo.length() == 0 {
            throw("task and repo are required")
          } else {
            {
              "status": "unsupported",
              "task": $task,
              "repo": $repo,
              "changes": [],
              "pr_url": null,
              "tests_passed": null,
              "ci_status": "not_run",
              "capability_gap": {
                "requested": "modify a repository, run its tests, and create a pull request",
                "missing": [
                  "authenticated repository checkout",
                  "durable filesystem writer",
                  "sandboxed command execution",
                  "forge API receipt",
                  "CI result receipt"
                ],
                "evidence": "This example accepts JSON and emits JSON; it has no git, filesystem, command, or forge component."
              },
              "metadata": {
                "skill": "auto-coder",
                "mode": "mcp",
                "trace_id": $trace_id,
                "timestamp": now()
              }
            }
          }

  output:
    sync_response: {}
