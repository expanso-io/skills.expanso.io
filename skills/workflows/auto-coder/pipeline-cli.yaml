# Expanso Pipeline: auto-coder capability check (CLI mode)
#
# This pipeline deliberately does not claim to edit a repository. A JSON-only
# pipeline has no authenticated checkout, durable filesystem, command runner,
# or forge receipt with which to prove changes, tests, or a pull request.

name: auto-coder-cli
type: pipeline

config:
  input:
    stdin:
      codec: lines

  pipeline:
    processors:
      - mapping: |
          let trace_id = uuid_v4()
          let input = content().parse_json()
          let task = $input.task.or("").string()
          let repo = $input.repo.or("").string()

          root = if $task.length() == 0 || $repo.length() == 0 {
            throw("task and repo are required")
          } else {
            {
              "status": "unsupported",
              "task": $task,
              "repo": $repo,
              "changes": [],
              "pr_url": null,
              "tests_passed": null,
              "ci_status": "not_run",
              "capability_gap": {
                "requested": "modify a repository, run its tests, and create a pull request",
                "missing": [
                  "authenticated repository checkout",
                  "durable filesystem writer",
                  "sandboxed command execution",
                  "forge API receipt",
                  "CI result receipt"
                ],
                "evidence": "This example accepts JSON and emits JSON; it has no git, filesystem, command, or forge component."
              },
              "metadata": {
                "skill": "auto-coder",
                "mode": "cli",
                "trace_id": $trace_id,
                "timestamp": now()
              }
            }
          }

      - log:
          level: WARN
          message: "[auto-coder] unsupported: repository execution capabilities are not configured"

  output:
    stdout: {}
