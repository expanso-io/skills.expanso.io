# Expanso Pipeline: terminal-services (MCP mode)

name: terminal-services-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /service
      allowed_verbs: [POST]
      timeout: 60s

  pipeline:
    processors:
      - mapping: |
          root = {"status": "unsupported", "publication": "pulled", "skill": "terminal-services", "reason": "Reports completed service actions without contacting any service."}

  output:
    sync_response: {}
