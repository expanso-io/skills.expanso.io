tests:
  - name: "Extracts explicit voice-command fixture without claiming execution"
    input: '{"fixture_mode":true,"fixture_transcript":"Schedule a water-heater visit Tuesday at 2pm.","fixture_actions":[{"type":"schedule","subject":"water-heater visit","details":{"time":"Tuesday at 2pm"},"needs_confirmation":true}]}'
    expected_output:
      transcript: "Schedule a water-heater visit Tuesday at 2pm."
      actions:
        - type: schedule
          subject: water-heater visit
          details:
            time: "Tuesday at 2pm"
          needs_confirmation: true
      confirmations: []
      execution_status: proposed_only
