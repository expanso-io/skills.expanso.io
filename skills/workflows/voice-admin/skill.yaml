# Skill: voice-admin
# Version: 1.0.0
#
# Transcribe voice commands and extract proposed administrative actions.

name: voice-admin
version: 1.0.0
description: Transcribe voice commands and extract proposed admin actions without claiming external execution

credentials:
  - name: OPENAI_API_KEY
    required: true
  - name: MCP_BEARER_TOKEN
    required: false
    description: Required caller bearer token for the MCP endpoint (32+ characters)

inputs:
  - name: audio
    type: string
    description: Deprecated; use audio_url
  - name: audio_url
    type: string
    description: HTTPS URL of an audio object
  - name: language
    type: string
    description: Optional ISO-639-1 audio language
  - name: action
    type: string
    default: transcribe_and_extract
    enum: [transcribe_and_extract]

outputs:
  - name: transcript
    type: string
  - name: actions
    type: array
  - name: confirmations
    type: array
    description: Always empty; external actions are not executed
  - name: execution_status
    type: string
    description: proposed_only
  - name: metadata
    type: object

backends:
  - name: openai
    type: remote
    requires: [OPENAI_API_KEY]

components:
  inputs: [stdin, http_server]
  processors: [mapping, http, openai_transcription, openai_chat_completion, switch, log]
  outputs: [stdout, sync_response]
