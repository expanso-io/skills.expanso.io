# Expanso Pipeline: voice-admin (MCP mode)

name: voice-admin-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /voice
      allowed_verbs: [POST]
      timeout: 120s

  pipeline:
    processors:
      # Bearer verification uses AES-GCM tag validation so token comparison is
      # constant-time inside the authenticated-cipher implementation.
      - mapping: |
          let expected = env("MCP_BEARER_TOKEN").or("")
          let authorization = meta("Authorization").or("")
          let supplied = if $authorization.has_prefix("Bearer ") { $authorization.trim_prefix("Bearer ") } else { "" }
          let nonce = "000000000000000000000000".decode("hex")
          let proof = "expanso-mcp-auth".encrypt_aes("gcm", $expected.hash("sha256"), $nonce)
          let authenticated = $proof.decrypt_aes("gcm", $supplied.hash("sha256"), $nonce).catch(null) != null
          meta http_status_code = if $expected.length() < 32 { 503 } else if $supplied == "" || !$authenticated { 401 } else { 200 }
          root = if $expected.length() < 32 {
            deleted()
          } else if $supplied == "" || !$authenticated {
            deleted()
          } else {
            this
          }

      - mapping: |
          root = this
          root._trace_id = uuid_v4()

      - mapping: |
          let url = this.audio_url.or("").string()
          meta audio_url = $url
          meta language = this.language.or("")
          meta trace_id = this._trace_id
          root = if !$url.re_match("^https://") { throw("audio_url must be an https URL") } else { {} }
      - http:
          url: '${! meta("audio_url") }'
          verb: GET
          timeout: 60s
          retries: 3
      - openai_transcription:
          api_key: "${OPENAI_API_KEY}"
          model: whisper-1
          file: '${! content() }'
          language: '${! meta("language") }'
      - mapping: |
          root.transcript = content().string()
          root.audio_url = meta("audio_url")
          root._trace_id = meta("trace_id")
          root._source = "openai_transcription"

      - mapping: |
          meta state_json = this.format_json()
          root.messages = [
            {
              "role": "system",
              "content": "Extract proposed administrative actions from the transcript. Do not claim any action was executed. Return JSON: {\"actions\":[{\"type\":\"schedule|invoice|task|reminder|other\",\"subject\":\"\",\"details\":{},\"needs_confirmation\":true}]}"
            },
            {"role": "user", "content": this.transcript}
          ]
      - openai_chat_completion:
          api_key: "${OPENAI_API_KEY}"
          model: gpt-4o-mini
          tools: []
      - mapping: |
          let state = meta("state_json").parse_json()
          let parsed = this.choices.0.message.content.parse_json().catch({"actions": []})
          root = $state
          root.actions = $parsed.actions.or([])

      - mapping: |
          root.transcript = this.transcript
          root.actions = this.actions
          root.confirmations = []
          root.execution_status = "proposed_only"
          root.metadata = {
            "skill": "voice-admin",
            "mode": "mcp",
            "source": this._source,
            "trace_id": this._trace_id,
            "timestamp": now()
          }

      - catch:
          - mapping: |
              meta http_status_code = 502
              root = {"status": "error", "error": error()}

  output:
    sync_response: {}
