# Expanso Pipeline: devops-monitor (MCP mode)

name: devops-monitor-mcp
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /monitor
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let trace_id = uuid_v4()
          let workflows = this.workflows.or([])
          let errors = this.errors.or([])
          let metrics = this.metrics.or({})
          let threshold = this.alert_threshold.or("high").string()
          let threshold_order = {"critical": 0, "high": 1, "medium": 2, "low": 3}
          let min_severity = $threshold_order.get($threshold).or(1)

          let workflow_states = $workflows.map_each(run -> run.assign({"status": if run.status.or("") == "completed" { run.conclusion.or("unknown") } else { run.status.or("unknown") }}))
          let workflow_issues = $workflow_states.filter(run -> run.status != "success").map_each(run -> {
            "severity": if run.status.or("") == "failure" { "high" } else { "medium" },
            "source": "workflow",
            "description": run.repo.or("unknown") + " / " + run.name.or("workflow") + " is " + run.status.or("unknown"),
            "suggestion": "Inspect the recorded workflow run and its logs",
            "source_id": run.id.or(null)
          })
          let log_issues = $errors.map_each(event -> {
            "severity": if event.count.or(1) >= 10 { "high" } else { "medium" },
            "source": "logs",
            "description": event.message.or("Unspecified error"),
            "suggestion": "Inspect the source log events and affected service",
            "source_id": event.id.or(null)
          })
          let all_issues = $workflow_issues.concat($log_issues)
          let issues = $all_issues.filter(issue -> $threshold_order.get(issue.severity).or(3) <= $min_severity)
          let overall = if $all_issues.any(issue -> issue.severity == "critical") {
            "critical"
          } else if $all_issues.length() > 0 {
            "degraded"
          } else {
            "healthy"
          }

          root.status = {
            "overall_health": $overall,
            "issue_count": $issues.length(),
            "observed_issue_count": $all_issues.length()
          }
          root.issues = $issues
          root.workflows = $workflows
          root.metrics = $metrics
          root.alert_candidates = $issues
          root.metadata = {
            "skill": "devops-monitor",
            "mode": "mcp",
            "source": "request",
            "alert_threshold": $threshold,
            "trace_id": $trace_id,
            "timestamp": now()
          }

  output:
    sync_response: {}
