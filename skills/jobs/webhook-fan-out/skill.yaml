# Skill: webhook-fan-out
name: webhook-fan-out
version: 1.0.0
description: Accept events on one webhook and deliver every event to
  several endpoints, each retrying independently.
author:
  name: Expanso Team
  url: https://expanso.io
  avatar: EX
job: 'A webhook fan-out: deliver every event to several endpoints.'
credentials:
- name: WEBHOOK_SECRET
  required: true
  description: Shared HMAC-SHA256 secret used to authenticate inbound events.
- name: RECEIVER_A_TOKEN
  required: true
  description: Bearer token sent only to receiver A over HTTPS.
- name: RECEIVER_B_TOKEN
  required: true
  description: Bearer token sent only to receiver B over HTTPS.
- name: RECEIVER_C_TOKEN
  required: true
  description: Bearer token sent only to receiver C over HTTPS.
inputs: []
outputs: []
backends:
- name: local
  type: local
  requires: []
components:
  inputs:
  - http_server
  processors:
  - mapping
  outputs:
  - broker
  - http_client
job_specs:
- pipeline.yaml
proof:
  status: executed-local-only
  date: '2026-09-18'
  expanso_edge: v2.1.21
  authentication_matches_current: false
  record: skills/jobs/PROOF-2026-09-18.md
  runs:
  - where: local-mode-node
    detail: Submitted to a local-mode node (expanso-edge run --local).
      Not run through Cloud.
    checks_passed: 6/6
  proved:
  - 10 events in; each of 3 receivers got all 10 exactly once, including
    one that answered 503 twice.
  not_proved:
  - Any run through Cloud; real third-party receivers (receivers were
    local test sinks).
  - The current HMAC input verification, HTTPS requirement, and receiver
    bearer authentication, which were added after the dated run.
  note: The dated run predates the current authentication and TLS
    requirements, so it is not proof of the current security behavior.
    Inputs in the runs were synthetic fixtures unless a proved line says
    otherwise.
dependencies:
  network_egress:
    required: true
    endpoints:
    - host: each receiver
      protocol: https
      purpose: POST each event with receiver-specific bearer authentication
  third_party_apis: []
  credentials_transmitted:
  - name: RECEIVER_A_TOKEN
    to: receiver A in the HTTPS Authorization header
    not_to: [Expanso Cloud, pipeline definition, other receivers]
  - name: RECEIVER_B_TOKEN
    to: receiver B in the HTTPS Authorization header
    not_to: [Expanso Cloud, pipeline definition, other receivers]
  - name: RECEIVER_C_TOKEN
    to: receiver C in the HTTPS Authorization header
    not_to: [Expanso Cloud, pipeline definition, other receivers]
  data_leaving_host:
  - what: every event body
    to: every receiver
  offline_capable: false
