# pipeline.yaml: the webhook-fan-out job, derived from
# expanso-io/docs.expanso.io commit f6eab2b,
# docs/recipes/webhook-fan-out.mdx (draft).
# See README.md for dependency setup, signed sample requests,
# and the scope of the dated execution proof. Set this listener
# address for your environment:
#   .input.http_server.address = 127.0.0.1:8089
# The selector pipeline_role: webhooks is an example; label your node
# to match or change it. Use underscores in label keys.
#
name: webhook-fan-out
type: pipeline
selector:
  match_labels:
    pipeline_role: webhooks
config:
  input:
    http_server:
      address: "127.0.0.1:8089"
      path: /webhook
      allowed_verbs: [POST]
  pipeline:
    processors:
      - mapping: |
          let secret = env("WEBHOOK_SECRET").or("")
          let provided = meta("X-Webhook-Signature").or("")
          let expected = content().hash("hmac_sha256", $secret).encode("hex")
          root = if $secret == "" {
            deleted()
          } else if $provided != $expected {
            deleted()
          } else { this }
      - mapping: |
          root = this
          root.received_at = now()
  output:
    broker:
      pattern: fan_out
      outputs:
        - http_client:
            url: "https://${RECEIVER_A_HOST}/notify"
            verb: POST
            headers:
              Content-Type: application/json
              Authorization: "Bearer ${RECEIVER_A_TOKEN}"
            retries: 5
            retry_period: 200ms
        - http_client:
            url: "https://${RECEIVER_B_HOST}/notify"
            verb: POST
            headers:
              Content-Type: application/json
              Authorization: "Bearer ${RECEIVER_B_TOKEN}"
            retries: 5
            retry_period: 200ms
        - http_client:
            url: "https://${RECEIVER_C_HOST}/notify"
            verb: POST
            headers:
              Content-Type: application/json
              Authorization: "Bearer ${RECEIVER_C_TOKEN}"
            retries: 5
            retry_period: 200ms
