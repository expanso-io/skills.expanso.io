# Skill: rss-feed-engine
name: rss-feed-engine
version: 1.0.0
description: Poll an RSS feed, emit one normalized JSON record per item,
  never emit the same GUID twice (even across restarts).
author:
  name: Expanso Team
  url: https://expanso.io
  avatar: EX
job: 'An RSS or news feed engine: poll feeds, parse items, deduplicate,
  store.'
credentials: []
inputs: []
outputs: []
backends:
- name: local
  type: local
  requires: []
components:
  inputs:
  - generate
  processors:
  - http
  - xml
  - mapping
  - unarchive
  - dedupe
  outputs:
  - file
  caches:
  - file
job_specs:
- pipeline.yaml
proof:
  status: executed-cloud-and-local
  date: '2026-09-18'
  expanso_edge: v2.1.21
  runs:
  - where: expanso-cloud
    detail: Submitted to an Expanso Cloud workspace with a label selector
      and executed by the one operator-registered node carrying that
      label. Not a hosted runner; the job's dependencies ran on the
      same host as the node.
    checks_passed: 14/14
  - where: local-mode-node
    detail: Submitted to a local-mode node (expanso-edge run --local).
      Not run through Cloud.
    checks_passed: 14/14
  proved:
  - Live NASA (10 items) and BBC Technology (21 items, GMT dates) feeds
    each matched an independent fetch of the same feed.
  - A duplicate GUID was emitted once; a restarted job emitted 0 items
    it had already seen (file-backed dedupe cache).
  not_proved:
  - Feeds other than RSS 2.0 (Atom was not tested).
  note: The job spec has the same structure as the job that ran. Only
    the values listed in its header comment differ, and long mappings
    are rewrapped. Inputs in the runs were synthetic fixtures unless
    a proved line says otherwise.
dependencies:
  network_egress:
    required: true
    endpoints:
    - host: the feed host
      protocol: https
      purpose: GET the feed
  third_party_apis: []
  credentials_transmitted: []
  data_leaving_host:
  - what: an HTTP GET for the feed URL
    to: the feed host
  offline_capable: false
