# Expanso Pipeline: determinism-test (MCP mode)

name: determinism-test-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /test
      allowed_verbs: [POST]
      timeout: 120s

  pipeline:
    processors:
      - mapping: |
          root = {"status": "unsupported", "publication": "pulled", "skill": "determinism-test", "reason": "Copies one input hash instead of executing the requested pipeline repeatedly and measuring its output stability."}

  output:
    sync_response: {}
