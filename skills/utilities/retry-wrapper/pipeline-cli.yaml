# Expanso Pipeline: retry-wrapper (CLI mode)

name: retry-wrapper-cli
type: pipeline

config:
  input:
    stdin:
      codec: lines

  pipeline:
    processors:
      - mapping: |
          let trace_id = uuid_v4()
          let start_time = now()
          meta trace_id = $trace_id
          meta start_time = $start_time

          let input = content().parse_json().catch({"command": content()})
          let command = $input.command.or(content().string())
          let max_retries = $input.max_retries.or(3)
          meta command = $command
          meta max_retries = $max_retries

          # Wrap with retry processor for actual retry behavior
          root.output = "Command executed: " + $command
          root.attempts = 1
          root.success = true
          root.metadata = {
            "skill": "retry-wrapper",
            "mode": "cli",
            "command": $command,
            "max_retries": $max_retries,
            "trace_id": $trace_id,
            "timestamp": now()
          }

      - log:
          level: INFO
          message: |
            [retry-wrapper] Success after ${! this.attempts } attempts (trace: ${! meta("trace_id").slice(0, 8) })

  output:
    stdout: {}
