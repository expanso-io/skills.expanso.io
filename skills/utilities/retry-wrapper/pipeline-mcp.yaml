# Expanso Pipeline: retry-wrapper (MCP mode)

name: retry-wrapper-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /execute
      allowed_verbs: [POST]
      timeout: 120s

  pipeline:
    processors:
      - mapping: |
          root = {"status": "unsupported", "publication": "pulled", "skill": "retry-wrapper", "reason": "Reports command success and retry attempts without execution; running caller-supplied commands would introduce a security risk."}

  output:
    sync_response: {}
