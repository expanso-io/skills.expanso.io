# Expanso Pipeline: openapi-validate (MCP mode)

name: openapi-validate-mcp
type: pipeline

config:
  http:
    enabled: true
    address: "0.0.0.0:${PORT:-8080}"

  input:
    http_server:
      path: /validate
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          root = {"status": "unsupported", "publication": "pulled", "skill": "openapi-validate", "reason": "Reports request or response validity from a version field without validating against the OpenAPI contract."}

  output:
    sync_response: {}
