# Expanso Pipeline: openapi-validate (CLI mode)

name: openapi-validate-cli
type: pipeline

config:
  input:
    stdin:
      codec: lines

  pipeline:
    processors:
      - mapping: |
          root = {"status": "unsupported", "publication": "pulled", "skill": "openapi-validate", "reason": "Reports request or response validity from a version field without validating against the OpenAPI contract."}

  output:
    stdout: {}
