# Expanso Pipeline: text-to-command (MCP mode)
# ==========================================

name: text-to-command-mcp
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:-8080}"
      path: /generate
      allowed_verbs: [POST]
      timeout: 30s

  pipeline:
    processors:
      - mapping: |
          let instruction = this.instruction.or("")

          root.error = if $instruction.length() == 0 {
            "instruction field is required"
          } else { deleted() }

          meta input_hash = $instruction.hash("sha256").encode("hex")
          meta trace_id = uuid_v4()

          let shell = this.shell.or("bash")
          let context = this.context.or("")

          let context_section = if $context.length() > 0 {
            "\nContext: " + $context
          } else { "" }

          root.messages = [
            {
              "role": "system",
              "content": "You are a CLI command generator. Convert natural language to " + $shell + " commands. Return JSON with 'command' and 'explanation'. Be precise and safe."
            },
            {
              "role": "user",
              "content": "Convert to " + $shell + " command:\n\n" + $instruction + $context_section + "\n\nReturn JSON: {\"command\": \"...\", \"explanation\": \"...\"}"
            }
          ]

      - switch:
          - check: this.error == null
            processors:
              - openai_chat_completion:
                  api_key: "${OPENAI_API_KEY}"
                  model: gpt-4o-mini
                  tools: []

      - mapping: |
          let raw = this.choices.0.message.content.or("")
          let parsed = $raw.parse_json().catch({"command": "", "explanation": ""})
          root = if this.error != null {
            {
              "error": this.error,
              "metadata": {
                "skill": "text-to-command",
                "mode": "mcp",
                "trace_id": meta("trace_id").or(uuid_v4()),
                "timestamp": now()
              }
            }
          } else {
            {
              "command": $parsed.command.or(""),
              "explanation": $parsed.explanation.or(""),
              "shell": this.shell.or("bash"),
              "metadata": {
                "skill": "text-to-command",
                "mode": "mcp",
                "model": "gpt-4o-mini",
                "input_hash": meta("input_hash"),
                "trace_id": meta("trace_id").or(uuid_v4()),
                "timestamp": now()
              }
            }
          }

  output:
    sync_response: {}
