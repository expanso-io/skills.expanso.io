tests:
  - name: "Downloads audio and returns the transcription provider result"
    input: '{"audio_url":"https://media.example.test/hello.wav"}'
    provider_responses:
      - mock-audio-bytes
    ai_responses:
      - Hello from the audio provider.
    expected_output:
      transcript: "Hello from the audio provider."
      metadata:
        source: openai_transcription
