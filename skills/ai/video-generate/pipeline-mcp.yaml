# Expanso Pipeline: video-generate (MCP mode)
# ============================================
#
# Generate short videos from text prompts using Replicate AI.
# HTTP server mode for MCP/OpenClaw integration.
#
# Usage:
#   expanso-edge validate pipeline-mcp.yaml
#
#   curl -X POST http://localhost:8080/generate \
#     -H "Content-Type: application/json" \
#     -d '{"prompt": "A cat playing piano"}'

name: video-generate-mcp
type: pipeline

config:
  input:
    http_server:
      address: "0.0.0.0:${PORT:8080}"
      path: /generate
      allowed_verbs: [POST]
      timeout: 300s

  pipeline:
    processors:
      # Bearer verification uses AES-GCM tag validation so token comparison is
      # constant-time inside the authenticated-cipher implementation.
      - mapping: |
          let expected = env("MCP_BEARER_TOKEN").or("")
          let authorization = meta("Authorization").or("")
          let supplied = if $authorization.has_prefix("Bearer ") { $authorization.trim_prefix("Bearer ") } else { "" }
          let nonce = "000000000000000000000000".decode("hex")
          let proof = "expanso-mcp-auth".encrypt_aes("gcm", $expected.hash("sha256"), $nonce)
          let authenticated = $proof.decrypt_aes("gcm", $supplied.hash("sha256"), $nonce).catch(null) != null
          meta http_status_code = if $expected.length() < 32 { 503 } else if $supplied == "" || !$authenticated { 401 } else { 200 }
          root = if $expected.length() < 32 {
            deleted()
          } else if $supplied == "" || !$authenticated {
            deleted()
          } else {
            this
          }

      # 1. Validate and parse input
      - mapping: |
          let body = content().parse_json()
          let prompt = $body.prompt.or("")

          if $prompt == "" {
            root = throw("prompt field is required")
          }

          root.prompt = $prompt
          root._trace_id = uuid_v4()
          root._start_time = now()

      # 2. Submit the request to Replicate and poll until it finishes.
      - mapping: |
          meta trace_id = this._trace_id
          meta start_time = this._start_time
          root = {
            "version": "5522017e7bc92c4b2d90cc09a65051d7ade8e26c2932444ba16ca0f7a9b5cbb2",
            "input": {
              "prompt": this.prompt,
              "prompt_optimizer": true
            }
          }
      - http:
          url: "https://api.replicate.com/v1/predictions"
          verb: POST
          headers:
            Authorization: "Bearer ${REPLICATE_API_TOKEN}"
            Content-Type: "application/json"
      - mapping: |
          meta prediction_id = this.id
          meta poll_url = this.urls.get
          meta status = this.status
          root = this
      - while:
          at_least_once: true
          max_loops: 60
          check: 'meta("status") == "starting" || meta("status") == "processing"'
          processors:
            - sleep:
                duration: "3s"
            - http:
                url: '${! meta("poll_url") }'
                verb: GET
                headers:
                  Authorization: "Bearer ${REPLICATE_API_TOKEN}"
            - mapping: |
                meta status = this.status
                root = this
      - mapping: |
          let status = this.status
          let output = this.output

          root.video_url = if $status == "succeeded" { $output.index(0).or("") } else { "" }
          root.status = $status
          root.error = if $status == "failed" { this.error } else { null }
          root.metadata = {
            "skill": "video-generate",
            "mode": "mcp",
            "model": "minimax/video-01",
            "prediction_id": meta("prediction_id"),
            "source": "replicate_api",
            "trace_id": meta("trace_id").or(uuid_v4()),
            "started_at": meta("start_time"),
            "completed_at": now()
          }

      - log:
          level: INFO
          message: |
            [video-generate] Status: ${! this.status } (trace: ${! this.metadata.trace_id.slice(0, 8) })

  output:
    sync_response: {}
