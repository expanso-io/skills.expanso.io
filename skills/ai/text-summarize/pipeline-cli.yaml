# Expanso Pipeline: text-summarize (CLI mode)
# ============================================
#
# Summarize text into bullet points via command line.
#
# Validate locally (no control plane needed):
#   expanso-edge validate pipeline-cli.yaml
#   expanso-cli job validate pipeline-cli.yaml --offline
#
# Deploy to your Expanso Cloud control plane:
#   expanso-cli job deploy pipeline-cli.yaml
#
# NOTE: `expanso-edge run` starts the node AGENT; it does not run this file as a
# pipeline. There is no supported `expanso-edge run <pipeline>` form.
#
# INPUT: this pipeline reads stdin. A Cloud-scheduled job's stdin is NOT
# connected
# to your terminal, so as written this shape only works where the pipeline runs
# attached to a process you control. For a Cloud-scheduled job, change the
# input to
# one the node can reach itself (file, http_server, a queue, or object storage).
#
# CREDENTIAL AND DATA EGRESS:
#   OPENAI_API_KEY is read from the environment of the node that executes this
#   pipeline -- for a Cloud-scheduled job that is the edge node, not your
#   laptop.
#   It is not sent to Expanso Cloud and is not stored in this file.
#   It IS sent to OpenAI, as the bearer credential on every request.
#   The ENTIRE input text is also sent to OpenAI. This pipeline is not offline
#   and not local-only unless you repoint it at a model you host yourself.
#
# Validates against: docs.expanso.io/schemas/pipeline.schema.json

name: text-summarize-cli
type: pipeline

config:
  input:
    stdin:
      codec: lines
      max_buffer: 1048576  # 1MB max input

  pipeline:
    processors:
      # 1. Prepare input with audit metadata
      - mapping: |
          # Generate audit trail data
          meta input_hash = content().hash("sha256").encode("hex")
          meta input_length = content().length()
          meta trace_id = uuid_v4()

          # Prepare prompt for summarization
          root.messages = [
            {
              "role": "system",
              "content": "You are a professional summarizer. Create a clear, actionable summary in 3-5 bullet points. Each bullet should capture a key insight or action item. Be concise but complete."
            },
            {
              "role": "user",
              "content": "Summarize the following text:\n\n" + content()
            }
          ]

      # 2. Call OpenAI (key read from the executing node's environment,
      #    then sent to OpenAI)
      - openai_chat_completion:
          api_key: "${OPENAI_API_KEY}"
          model: gpt-4o-mini
          # Required by the component schema on expanso-edge v2.1.21.
          # Empty list = no tool/function calling for this request.
          tools: []

      # 3. Format output with metadata
      - mapping: |
          root.summary = this.choices.0.message.content
          root.metadata = {
            "skill": "text-summarize",
            "mode": "cli",
            "model": "gpt-4o-mini",
            "input_hash": meta("input_hash"),
            "input_length": meta("input_length"),
            "trace_id": meta("trace_id"),
            "timestamp": now()
          }

      # 4. Audit log (appears in expanso-edge logs, not in output)
      - log:
          level: INFO
          message: |
            [text-summarize] Summarized ${! meta("input_length") } chars → ${! this.summary.length() } chars (trace: ${! meta("trace_id").slice(0, 8) })

  output:
    stdout:
      codec: json_object
