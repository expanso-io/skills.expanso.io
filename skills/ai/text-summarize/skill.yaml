# Skill: text-summarize
# Version: 1.0.0
#
# Summarize any text into concise bullet points using an AI model.
#
# NETWORK AND DATA TRANSFER -- read before deploying:
#   With the default (openai) backend this skill is NOT offline and NOT local-only.
#   * It makes an outbound HTTPS call to the OpenAI API (api.openai.com).
#   * OPENAI_API_KEY is transmitted to OpenAI as the bearer credential. It is not
#     sent to Expanso Cloud and is not stored in this file -- but it does leave the
#     host, to OpenAI.
#   * The ENTIRE input text is transmitted to OpenAI and is subject to their data
#     handling terms. Do not feed it data you may not send to a third party.
#   Only the ollama backend, pointed at a model you host, avoids this egress.
#
#   The credential is read from the environment of whichever node runs the
#   pipeline. For a Cloud-scheduled job that is the edge node, not your laptop.

name: text-summarize
version: 1.0.0
description: Summarize text into 3-5 bullet points using AI

# Credentials
# Resolved from the runtime environment of the node executing the pipeline; not
# embedded in the pipeline definition and not sent to Expanso Cloud. With the
# openai backend the key IS transmitted to OpenAI to authenticate the request.
credentials:
  - name: OPENAI_API_KEY
    required: false  # Not required if using Ollama
    description: OpenAI API key for remote inference

# Skill inputs
inputs:
  - name: text
    type: string
    required: true
    description: Text to summarize (up to 1MB)
  - name: bullet_count
    type: integer
    default: 5
    description: Maximum number of bullet points (3-10)
  - name: style
    type: string
    default: concise
    enum: [concise, detailed, executive]
    description: Summary style

# Skill outputs
outputs:
  - name: summary
    type: string
    description: Bulleted summary of the input text
  - name: metadata
    type: object
    description: Audit metadata (model, timestamp, input_hash)

# Backend options (Expanso Edge flexibility)
backends:
  - name: openai
    type: remote
    requires: [OPENAI_API_KEY]
    description: OpenAI GPT-4o-mini (fast, ~$0.001 per summary)
  - name: ollama
    type: local
    models: [llama3.2, mistral, phi3]
    description: Local Ollama (private, free, slower)

# Declared runtime dependencies (task 3.5)
dependencies:
  network_egress:
    required: true
    scope: "Required for the default openai backend; not required for a locally hosted ollama backend."
    endpoints:
      - host: api.openai.com
        protocol: https
        purpose: chat completion request
  third_party_apis:
    - name: OpenAI Chat Completions
      component: openai_chat_completion
      credential: OPENAI_API_KEY
      data_sent: "The full input text, plus the system and user prompt."
      data_returned: "Model-generated summary text."
  credentials_transmitted:
    - name: OPENAI_API_KEY
      to: api.openai.com
      not_to: [Expanso Cloud, pipeline definition]
  data_leaving_host:
    - what: "Entire input text (stdin for CLI mode, HTTP request body for MCP mode)"
      to: api.openai.com
      when: "Every invocation using the openai backend"
  offline_capable: false
  offline_capable_with:
    backend: ollama
    note: "Requires a self-hosted model endpoint reachable from the executing node."

# Expanso components used
components:
  inputs:
    - stdin          # CLI mode
    - http_server    # MCP mode
  processors:
    - mapping
    - openai_chat_completion
    - log
  outputs:
    - stdout         # CLI mode
    - sync_response  # MCP mode
